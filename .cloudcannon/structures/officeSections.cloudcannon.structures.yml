officeSections:
  style: select
  values:
    - label: Office
      icon: location_on
      value:
        name: ""
        phones:
          - display: ""
            href: ""
        addresses:
          - lines: []
            city: ""
            state: ""
            postalCode: ""
            mapUrl: ""
        officeHours: []
        officeHoursNote: ""
      _inputs:
        officeHours:
          type: array
          comment: "Office hours entries."
