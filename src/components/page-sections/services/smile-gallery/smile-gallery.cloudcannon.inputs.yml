backgroundColor:
  type: select
  comment: Background color used behind the grid.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black
backgroundGradient:
  type: textarea
  comment: "Optional CSS gradient applied behind the section content."
backgroundImage:
  type: object
  comment: Background image configuration for the section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
slideNumbers:
  type: switch
  comment: "Toggle to display slide numbers (1/10) instead of indicator dots."
floatingArrows:
  type: switch
  comment: "Toggle to display floating arrows on the carousel."
gallerySlides:
  type: array
  label: Gallery Slides
  comment: Slides rendered in the smile gallery carousel.
  options:
    structures: _structures.gallerySlides
beforeLabel:
  type: text
  comment: Caption shown under the "before" photos on every slide.
afterLabel:
  type: text
  comment: Caption shown under the "after" photos on every slide.
aspectRatio:
  type: select
  comment: Crop every photo to the same shape so before and after line up.
  options:
    values:
      - id: none
        name: None (use each photo's own shape)
      - id: square
        name: Square (1:1)
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: widescreen
        name: Widescreen (16:9)
