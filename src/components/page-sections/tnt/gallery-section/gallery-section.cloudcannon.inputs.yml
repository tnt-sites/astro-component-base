heading:
  type: text
  comment: Optional heading shown above the gallery grid.
headingLevel:
  type: select
  comment: HTML heading level (h1-h6).
  options:
    values:
      - id: h1
        name: H1
      - id: h2
        name: H2
      - id: h3
        name: H3
      - id: h4
        name: H4
      - id: h5
        name: H5
      - id: h6
        name: H6
items:
  type: array
  label: Gallery Images
  comment: Images rendered in the responsive gallery grid.
  options:
    structures: _structures.galleryItems
colorScheme:
  type: select
  comment: Color scheme theme applied to the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: default
        name: Default
      - id: contrast
        name: Contrast
backgroundColor:
  type: select
  comment: Background color for the section.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
