id:
  type: text
  comment: Optional HTML id for this section, for anchor links.
heading:
  type: text
  comment: Section heading.
intro:
  type: markdown
  comment: Optional introductory paragraph above the accordion.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: true
    numberedlist: true
    styles: /.cloudcannon/styles/editor.css
faqs:
  type: array
  label: Questions
  comment: Question and answer pairs. Only one is open at a time.
  options:
    structures: _structures.locationFaqs
backgroundColor:
  type: select
  comment: Section background color.
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Main text color (headings, body copy, captions).
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
accentColor:
  type: select
  comment: Accent color — link/button hover states, star ratings, and similar highlights.
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
iconColor:
  type: select
  comment: Icon color (SVG fill/stroke).
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
