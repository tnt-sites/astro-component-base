id:
  type: text
  comment: Optional HTML id for this section, for anchor links.
heading:
  type: text
  comment: Page H1. Displayed in uppercase.
subheading:
  type: text
  comment: Larger supporting headline shown under the H1.
backgroundColor:
  type: select
  comment: Section background color.
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Main text color (headings, body copy, captions).
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
accentColor:
  type: select
  comment: Accent color — link/button hover states, star ratings, and similar highlights.
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
iconColor:
  type: select
  comment: Icon color (SVG fill/stroke).
  options:
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
