id:
  type: text
  comment: Optional HTML id for this section, for anchor links.
heading:
  type: text
  comment: Section heading.
intro:
  type: markdown
  comment: Introductory paragraph shown above the icons.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: true
    numberedlist: true
    styles: /.cloudcannon/styles/editor.css
icons:
  type: array
  label: Payment Options
  comment: Icon callouts, each opening a pop-up describing a payment option.
  options:
    structures: _structures.locationIcons
