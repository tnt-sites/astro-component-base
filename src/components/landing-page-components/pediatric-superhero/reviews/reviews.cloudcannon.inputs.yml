backgroundColor:
  type: select
  comment: Background color of the testimonial section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
reviewLogo:
  type: object
  comment: Optional review platform logo shown in the badge (e.g. Google).
  options:
    structures:
      values:
        - label: Review Logo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the review platform logo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

stars:
  type: number
  comment: Number of star icons to display (0-5).

reviewText:
  type: textarea
  comment: Main testimonial body copy.

reviewerName:
  type: text
  comment: Name shown after the testimonial text.

badgeBackgroundColor:
  type: select
  comment: Background color for the badge column (CSS color value).
  options:
    allow_empty: true
    values: _select_data.backgroundColors

headingColor:
  type: select
  comment: Optional badge text color override.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
