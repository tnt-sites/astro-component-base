backgroundColor:
  type: select
  comment: Background color of the banner section. Use None when a background image is set on the section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
cityState:
  type: text
  comment: City/state name shown in lighter text above the main heading (e.g. "Vermont's").

heading:
  type: text
  comment: Main H1 heading in large condensed type. Supports <br> for line breaks (e.g. "Top-Rated <br>Implant Dentists").

offerLabel:
  type: text
  comment: Small uppercase label above the offer title inside the offer box (e.g. "One-On-One").

offerTitle:
  type: text
  comment: Large accent-colored offer title inside the offer box (e.g. "Consultation").

offerSubtitle:
  type: text
  comment: Bold detail line inside the offer box (e.g. "Includes Exam, X-Ray, and CBCT Scan").

image:
  type: object
  comment: Doctor or team photo displayed on the right side of the banner.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the banner photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text describing the photo.

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the photo (e.g. doctor names).

buttonSections:
  type: array
  comment: Optional CTA button(s) displayed below the offer box.
  options:
    structures: _structures.buttonSections

accentColor:
  type: select
  comment: Accent color used for the offer title text inside the offer box.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the city/state text above the main heading.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
