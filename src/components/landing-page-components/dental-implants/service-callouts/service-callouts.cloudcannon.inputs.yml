backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: text
  comment: Optional section heading above the cards (e.g. "Your Implant Options"). Supports <br>.

items:
  type: array
  comment: Each card represents one implant service option.
  options:
    structures:
      values:
        - label: Service Card
          icon: link
          value:
            heading: ""
            image:
              source: ""
              alt: ""
            text: ""
            link: ""
          _inputs:
            heading:
              type: text
              comment: Title displayed above the portrait image.
            image:
              type: object
              options:
                structures:
                  values:
                    - label: Image
                      icon: image
                      value:
                        source: ""
                        alt: ""
                      _inputs:
                        source:
                          type: image
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: textarea
            text:
              type: textarea
              comment: Short description shown below the portrait.
            link:
              type: url
              comment: URL the card links to.

headingColor:
  type: select
  comment: Color of the section heading and card h3 titles.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

accentColor:
  type: select
  comment: Hover accent color for card portrait borders and headings.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
