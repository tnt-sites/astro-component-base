backgroundColor:
  type: select
  comment: Background color of the section. The dark section background is applied by sectionColor below; set this to None unless you need a theme color instead.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
items:
  type: array
  comment: Each card in the dark callout strip.
  options:
    structures:
      values:
        - label: Callout Card
          icon: dashboard
          value:
            headingLine1: ""
            headingLine2: ""
            iconName: ""
            iconCount: 1
            iconColor: ""
            link: ""
          _inputs:
            headingLine1:
              type: text
              comment: First line of the heading, shown above the icon row (e.g. "Find Us").
            headingLine2:
              type: text
              comment: Second line of the heading, shown below the icon row (e.g. "On The Map").
            iconName:
              type: text
              comment: Fontello icon class name (e.g. "icon-map-marker", "icon-star"). See tntwebsites.com/tnticons/demo.html for all options. Leave blank for no icon.
            iconCount:
              type: number
              comment: Number of times to repeat the icon (e.g. 5 for five stars). Min 1, max 10.
            iconColor:
              type: select
              options:
                allow_empty: true
                values: "data.colors.all[?(@.text == true)]"
                value_key: id
                preview:
                  text:
                    - key: name
              comment: Color of the icon(s). Leave blank to use the section accent color.
            iconPosition:
              type: select
              comment: Where the icon row appears relative to the heading text.
              options:
                values:
                  - id: middle
                    name: Between lines (default)
                  - id: bottom
                    name: Below heading
            link:
              type: url
              comment: Optional URL the card links to. Leave blank for a non-clickable card.

sectionColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: Background color of the dark strip. Defaults to #324248 (dark teal).

accentColor:
  type: select
  comment: Color of the inset border overlay on each portrait card.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
