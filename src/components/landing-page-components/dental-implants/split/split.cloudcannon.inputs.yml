backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: text
  comment: Section heading (h2). Supports <br> for line breaks.

paragraphs:
  type: array
  comment: Body text paragraphs. Each item is one paragraph and supports basic inline HTML.
  options:
    structures:
      values:
        - label: Paragraph
          icon: notes
          value: ""
          _inputs:
            value:
              type: textarea

image:
  type: object
  comment: Photo displayed in the split column.
  options:
    structures:
      values:
        - label: Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the image.

buttonSections:
  type: array
  comment: Optional CTA button(s) below the text.
  options:
    structures: _structures.buttonSections

reverse:
  type: checkbox
  comment: When checked, the image appears on the left and content on the right.

imageNoShadow:
  type: checkbox
  comment: When checked, removes the drop shadow from the image.

headingColor:
  type: select
  comment: Color of the section h2 heading.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

accentColor:
  type: select
  comment: Accent color used for links or highlighted elements within the section.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
