backgroundColor:
  type: select
  comment: Background color of the top bar.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
items:
  type: array
  comment: Announcement items separated by bullet dots.
  options:
    structures:
      values:
        - label: Item
          icon: title
          value: ""

textColor:
  type: select
  comment: Text color for the top bar. Defaults to the current color scheme text color.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
