backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
subheading:
  type: text
  comment: Small uppercase text displayed above the main heading (e.g. city name like "San Jose's").

heading:
  type: text
  comment: Main heading text. Supports <br> for manual line breaks.

badgeImages:
  type: array
  comment: Optional badge/stamp images displayed side-by-side below the heading (e.g. review badges, award seals).
  options:
    structures:
      values:
        - label: Badge Image
          icon: military_tech
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the badge or stamp image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

image:
  type: object
  comment: Full-height photo displayed on the right side of the banner.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the banner photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the photo (e.g. doctor name).

buttonSections:
  type: array
  comment: Optional CTA button(s) displayed below the badges.
  options:
    structures: _structures.buttonSections

borderColor:
  type: select
  comment: Color of the decorative bottom border on the banner.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
