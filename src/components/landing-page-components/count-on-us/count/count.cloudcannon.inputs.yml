backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
headingLine1:
  type: text
  comment: First line of the large left heading (e.g. "Count").

headingLine2:
  type: text
  comment: Second line of the large left heading (e.g. "On Us").

listItems:
  type: array
  comment: Checklist items displayed next to the heading. Supports inline HTML.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

accentColor:
  type: select
  comment: Color used for the card's top/bottom border and the "+" bullet markers. Controls both together.
  options:
    allow_empty: true
    values: _select_data.brandColors

squareColor:
  type: select
  comment: Color of the decorative background squares that peek out from the card's corners.
  options:
    allow_empty: true
    values: _select_data.backgroundColors

boxBorderColor:
  type: select
  comment: Color of the decorative corner bracket lines around the outside of the card.
  options:
    allow_empty: true
    values: _select_data.brandColors

headingColor:
  type: select
  comment: Color of the large left heading text.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
