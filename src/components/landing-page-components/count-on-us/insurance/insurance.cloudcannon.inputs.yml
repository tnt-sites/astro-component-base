backgroundColor:
  type: select
  comment: Background color of the insurance section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
blocks:
  type: array
  comment: Insurance text blocks. Each block has a heading and body text.
  options:
    structures:
      values:
        - label: Insurance Block
          icon: health_and_safety
          value:
            heading: ""
            text: ""
          _inputs:
            heading:
              type: text
              comment: Block heading. Supports <br> for line breaks.
            text:
              type: markdown
              comment: Body text for this insurance block.
              options:
                bold: true
                italic: true
                link: true
                bulletedlist: false
                numberedlist: false
                strike: false

ruleColor:
  type: select
  comment: Color of the horizontal ruled lines on either side of each heading.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the heading text.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
