backgroundColor:
  type: select
  comment: Background color (used as fallback if no background image is set).
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
backgroundImage:
  type: object
  comment: Optional full-bleed background image behind the review card.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the background image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

reviewText:
  type: textarea
  comment: The review quote text. Opening and closing quotation marks are added automatically.

author:
  type: text
  comment: Author name displayed below the review quote (e.g. "- Levi P.").

googleLogoImage:
  type: object
  comment: Optional Google logo or reviewer avatar in the left panel.
  options:
    structures:
      values:
        - label: Google Logo
          icon: image
          value:
            source: ""
            alt: Google Reviews
          _inputs:
            source:
              type: image
              comment: Path or URL to the Google logo or avatar.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

starColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: Color of the five star symbols in the Google panel.

bracketColor:
  type: select
  comment: Color of the decorative corner bracket lines around the review card.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

googlePanelColor:
  type: select
  comment: Background color of the Google panel on the left side of the card.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
