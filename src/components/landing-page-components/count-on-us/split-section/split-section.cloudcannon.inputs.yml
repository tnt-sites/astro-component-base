backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
headingPrefix:
  type: text
  comment: Optional small label displayed above the main heading.

heading:
  type: text
  comment: Main section heading. Supports <br> for line breaks.

listItems:
  type: array
  comment: Checklist items. Each item supports inline HTML.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

image:
  type: object
  comment: Image displayed opposite the text content.
  options:
    structures:
      values:
        - label: Section Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the image.

reverse:
  type: checkbox
  comment: When enabled, the image appears on the left and text on the right.

accentColor:
  type: select
  comment: Color of the "+" bullet markers.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

squareColor:
  type: select
  comment: Color of the decorative background squares at the card's corners.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the main h2 heading text.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

prefixColor:
  type: select
  comment: Color of the small prefix label above the heading. Defaults to heading color when unset.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
