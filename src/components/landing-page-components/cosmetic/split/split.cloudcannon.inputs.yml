backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: textarea
  comment: Section heading (h2). Supports <br> and <span> to apply accent color (e.g. "Nobody Cares <br><span>More</span>").

paragraphs:
  type: array
  comment: Body text paragraphs. Each item is one paragraph and supports basic inline HTML.
  options:
    structures:
      values:
        - label: Paragraph
          icon: notes
          value: ""
          _inputs:
            value:
              type: textarea

image:
  type: object
  comment: Photo displayed in the split column.
  options:
    structures:
      values:
        - label: Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

figcaption:
  type: text
  comment: Optional caption below the image (e.g. "Our Amazing Dental Team").

reverse:
  type: checkbox
  comment: When checked, the image appears on the left and text on the right.

accentColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: Override accent color for heading spans. Leave blank to use the site default.

headingColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: Override heading text color. Leave blank to use the site default.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
