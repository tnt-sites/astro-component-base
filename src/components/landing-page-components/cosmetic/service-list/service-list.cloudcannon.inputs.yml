backgroundColor:
  type: select
  comment: Background color of the service list bar.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
services:
  type: array
  comment: List of cosmetic services to display as links separated by bullets.
  options:
    structures:
      values:
        - label: Service Link
          icon: link
          value:
            label: ""
            url: ""
          _inputs:
            label:
              type: text
              comment: Display name of the service (e.g. "Veneers").
            url:
              type: url
              comment: Link to the service page.

accentColor:
  type: select
  comment: Accent/link highlight color for the service list..
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
