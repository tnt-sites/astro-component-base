backgroundColor:
  type: select
  comment: Background color of the reviews section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: text
  comment: Section heading (h2) for the review quote column (e.g. "Patients Love Us").

reviewText:
  type: textarea
  comment: Patient review quote text (without surrounding quotation marks).

author:
  type: text
  comment: Reviewer name/attribution (e.g. "Regina W.").

buttonSections:
  type: array
  comment: Optional CTA button(s) shown under the review text.
  options:
    structures: _structures.buttonSections

sliderHeading:
  type: text
  comment: Small label above the before/after slider title (e.g. "Actual Patient Results").

sliderSubheading:
  type: text
  comment: Large title for the before/after slider (e.g. "Before & After").

beforeImage:
  type: object
  comment: The "before" photo for the comparison slider.
  options:
    structures:
      values:
        - label: Before Photo
          icon: image
          value:
            source: ""
            alt: Before
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

afterImage:
  type: object
  comment: The "after" photo for the comparison slider.
  options:
    structures:
      values:
        - label: After Photo
          icon: image
          value:
            source: ""
            alt: After
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

starColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Color for the star rating icons. Leave blank for the default star color.

accentColor:
  type: select
  comment: Accent/link color for the reviews section.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Heading text color for the reviews section.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

handleColor:
  type: select
  comment: Color for the before/after slider handle.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

handleArrowColor:
  type: select
  comment: Color for the before/after slider handle arrows.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
