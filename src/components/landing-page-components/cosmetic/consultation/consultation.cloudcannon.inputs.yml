backgroundColor:
  type: select
  comment: Background color of the consultation section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
heading:
  type: textarea
  comment: Section heading (h2). Supports <br> and <span> for accent color (e.g. "Request a FREE Smile Makeover <span>Consultation</span>").

formAction:
  type: url
  comment: URL that processes the form submission (e.g. a form handler endpoint or thank-you redirect).

formBlocks:
  type: array
  label: Form Fields
  comment: The form fields to render inside the form. Add inputs, textareas, hidden fields, and a submit button.
  options:
    structures: _structures.formBlocks

accentColor:
  type: select
  comment: Override accent color for the heading span. Leave blank to use the site default.
  options:
    allow_empty: true
    values: _select_data.brandColors

headingColor:
  type: select
  comment: Override heading text color. Leave blank to use the site default.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
