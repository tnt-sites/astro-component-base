backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: textarea
  comment: Main H1 heading. Supports <br> for line breaks and <span> to apply accent color (e.g. "Cosmetic <span>Dentists</span>").

tagline:
  type: text
  comment: Decorative line shown below the heading (e.g. "◆ ◆ ◆"). Use Unicode diamond characters or similar.

subheading:
  type: textarea
  comment: Short body text below the tagline. Supports basic inline HTML.

image:
  type: object
  comment: Banner photo displayed on the right side.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Primary (desktop) banner photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

mobileImage:
  type: object
  comment: Optional mobile-specific photo (shown at ≤790px). Leave source blank to reuse the desktop image.
  options:
    structures:
      values:
        - label: Mobile Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

figcaptionLinks:
  type: array
  comment: Doctor name links shown in the image caption (e.g. "Dr. Smith | Dr. Jones").
  options:
    structures:
      values:
        - label: Doctor Link
          icon: person
          value:
            name: ""
            url: ""
          _inputs:
            name:
              type: text
              comment: Doctor's display name.
            url:
              type: url
              comment: Link to the doctor's profile page.

accentColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Override the accent/brand color for this section. Leave blank to use the site default.

headingColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Override the heading text color. Leave blank to use the site default.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
