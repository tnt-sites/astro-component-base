backgroundColor:
  type: select
  comment: Background color of the welcome section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
paragraphs:
  type: array
  comment: Each item is one paragraph. The "emphasis" text is displayed in the accent color at the start.
  options:
    structures:
      values:
        - label: Paragraph
          icon: format_paragraph
          value:
            emphasis: ""
            body: ""
          _inputs:
            emphasis:
              type: text
              comment: Short emphasized phrase displayed in the accent color at the start of the paragraph (e.g. "We understand."). Leave blank to start the paragraph with plain text.
            body:
              type: textarea
              comment: The rest of the paragraph text following the emphasized phrase.

accentColor:
  type: select
  comment: Color of the emphasized phrase at the start of each paragraph.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
