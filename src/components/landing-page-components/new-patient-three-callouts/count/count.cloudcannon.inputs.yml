backgroundColor:
  type: select
  comment: Background color of the section behind the callout cards.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
overlapBanner:
  type: checkbox
  comment: When enabled, the cards overlap the section above by 100px (designed to sit below the banner). Disable if placing elsewhere on the page.

cards:
  type: array
  comment: The three callout cards. The first and last get rounded ends; the middle card gets the accent color.
  options:
    structures:
      values:
        - label: Callout Card
          icon: dashboard
          value:
            image:
              source: ""
              alt: ""
            text: ""
            listItems: []
          _inputs:
            image:
              type: object
              comment: Icon or illustration displayed at the top of the card.
              options:
                structures:
                  values:
                    - label: Card Icon
                      icon: image
                      value:
                        source: ""
                        alt: ""
                      _inputs:
                        source:
                          type: image
                          comment: Path or URL to the icon/illustration.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: text
                          comment: Alt text for accessibility (can be blank for decorative icons).
            text:
              type: text
              comment: Large callout text displayed below the icon. Supports <br> for line breaks.
            listItems:
              type: array
              comment: Optional bullet list of features or details shown below the callout text.
              options:
                structures:
                  values:
                    - label: List Item
                      icon: add
                      value: ""

primaryCardColor:
  type: select
  comment: Background color for the first and last cards.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

accentCardColor:
  type: select
  comment: Background color for the middle (accent) card.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

accentCardTextColor:
  type: select
  comment: Text color for the middle (accent) card.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

bulletColor:
  type: select
  comment: Color of the + bullet markers in card lists.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
