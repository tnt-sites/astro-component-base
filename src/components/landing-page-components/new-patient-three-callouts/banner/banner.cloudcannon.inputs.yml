backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
subheading:
  type: text
  comment: Small uppercase text displayed above the main heading (e.g. "Reston's").

heading:
  type: text
  comment: Main H1 heading text. Supports <br> for manual line breaks.

badgeImage:
  type: object
  comment: Optional badge or award image displayed below the heading.
  options:
    structures:
      values:
        - label: Badge Image
          icon: workspace_premium
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the badge image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

image:
  type: object
  comment: Full-height photo displayed on the right side of the banner.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the banner photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the banner photo (e.g. doctor name, office name).

buttonSections:
  type: array
  comment: Optional CTA buttons displayed below the badge image.
  options:
    structures: _structures.buttonSections

accentColor:
  type: select
  comment: Color of the left bracket decoration on the banner.
  options:
    allow_empty: true
    values: _select_data.brandColors

headingColor:
  type: select
  comment: Color of the main H1 heading.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
