backgroundColor:
  type: select
  comment: Background color used behind the box.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
text:
  type: html
  comment: Main Text
  options:
    styles: /.cloudcannon/styles/editor.css
blurbBackgroundColor:
  type: select
  comment: Background color used inside the box.
  options:
    allow_empty: true
    values: _select_data.backgroundColors

# Add your other component inputs here
# Example:
# text:
#   type: text
#   comment: The text content for the component.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
