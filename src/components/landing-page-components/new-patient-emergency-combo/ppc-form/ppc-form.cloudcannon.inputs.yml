backgroundColor:
  type: select
  comment: Background color used behind the grid.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
formAction:
  type: url
  comment: Where to send the form-data when the form is submitted. The URL that processes the form submission.
formBlocks:
  type: array
  comment: The form blocks to render inside the form.
  options:
    structures: _structures.formBlocks
text:
  type: textarea
textAlignment:
  comment: Conttrols the heading and text alignment.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
# Add your other component inputs here
# Example:
# text:
#   type: text
#   comment: The text content for the component.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
