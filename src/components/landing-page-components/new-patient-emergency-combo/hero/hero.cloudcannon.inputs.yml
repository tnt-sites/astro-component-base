backgroundColor:
  type: select
  comment: Background color used behind the grid.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
image:
  type: object
  comment: Image configuration for the hero section.
  options:
    structures:
      values:
        - label: Hero Image
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.

heading:
  type: text
  comment: Main headline text. Supports <br> for manual line breaks.

subtext:
  type: textarea
  comment: Supporting text shown beneath the headline.

buttonSections:
  type: array
  comment: Optional CTA buttons displayed below the badges.
  options:
    structures: _structures.buttonSections

badges:
  type: array
  comment: Optional badge images displayed below the supporting text.
  options:
    structures:
      values:
        - label: Badge
          icon: workspace_premium
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.

reverse:
  type: checkbox
  comment: Reverse layout so the image appears on the left.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
