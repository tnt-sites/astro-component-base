backgroundColor:
  type: select
  comment: Background color used behind the grid.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: markdown
  comment: Main heading text. Use "||" for mobile line breaks.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
text:
  type: markdown
  comment: Main Text
  options:
    blockquote: false
    bold: true
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
images:
  type: array
  comment: Array of logos/images to display under the text.
  options:
    structures:
      values:
        - label: Image
          icon: workspace_premium
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.
imageType:
  type: select
  comment: Determines styling for images
  options:
    values:
      - id: logos
        name: Logos
      - id: office
        name: Office Photos

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
