backgroundColor:
  type: select
  comment: Background color used behind the grid.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
headingColor:
  type: select
  comment: Color of the list section headings.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

listTextColor:
  type: select
  comment: Color of list item text.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

checkmarkColor:
  type: select
  comment: Color of the Fontello checkmark icons.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
items:
  type: array
  comment: Blocks for each image + heading + text
$.items[*].headingPrefix:
  type: markdown
  comment: First part of heading (e.g., "Looking for a")
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
$.items[*].headingMain:
  type: markdown
  comment: Main heading (e.g., "New Dentist?")
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
$.items[*].desktopImage.source:
  type: image
  comment: Desktop image source
$.items[*].desktopImage.alt:
  type: textarea
  comment: Desktop image alt text
$.items[*].mobileImage.source:
  type: image
  comment: Mobile image source
$.items[*].mobileImage.alt:
  type: textarea
  comment: Mobile image alt text
$.items[*].listText:
  type: markdown
  comment: Main Text
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: true
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
# Add your other component inputs here
# Example:
# text:
#   type: text
#   comment: The text content for the component.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
