backgroundColor:
  type: select
  comment: Background color used behind the hero banner.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
image:
  type: object
  comment: Full-width banner photo.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.

heading:
  type: text
  comment: Text displayed inside the banner bar card. Supports <br> for manual line breaks.

subtext:
  type: textarea
  comment: Optional supporting text shown beside the heading in the banner bar.

buttonSections:
  type: array
  comment: Optional CTA buttons in the banner bar.
  options:
    structures: _structures.buttonSections

badgeImage:
  type: object
  comment: Optional badge/seal image positioned in the top-right corner of the banner.
  options:
    structures:
      values:
        - label: Badge Image
          icon: military_tech
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the badge image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

specialBadge:
  type: object
  comment: Optional stamp/seal image that hangs off the left side of the banner bar card.
  options:
    structures:
      values:
        - label: Special Badge
          icon: workspace_premium
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the stamp image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption text overlaid at the bottom of the banner image.

borderColor:
  type: select
  comment: Color of the decorative bottom border on the hero.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
