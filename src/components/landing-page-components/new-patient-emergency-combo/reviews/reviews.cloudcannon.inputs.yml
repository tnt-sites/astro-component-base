backgroundColor:
  type: select
  comment: Background color used behind the review.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
image:
  type: object
  comment: Google logo that goes above the desktop review text.
  options:
    structures:
      values:
        - label: Desktop Reviews Image
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.
mobileImage:
  type: object
  comment: Google logo that goes above the mobile review text.
  options:
    structures:
      values:
        - label: Mobile Reviews Image
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alternative text for accessibility.
backgroundImage:
  type: object
  comment: Background image configuration for the reviews section.
  options:
    structures:
      values:
        - label: Background Image for Reviews
          icon: image
          value:
            _component: building-blocks/core-elements/image
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: The URL or path to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
reviewText:
  type: markdown
  comment: Main Review Text
  options:
    blockquote: false
    bold: true
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
author:
  type: text
  comment: Author Name
authorAlignX:
  type: select
  comment: Alignment of the author text.
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
textColor:
  type: select
  comment: Color of the review text.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
mobileTextColor:
  type: select
  comment: Color of the review text on mobile.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
starColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: Color of the review stars.
# Add your other component inputs here
# Example:
# text:
#   type: text
#   comment: The text content for the component.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
