formHeading:
  type: text
  comment: Heading shown above the form.

formAction:
  type: text
  comment: Form submit endpoint.

formMethod:
  type: select
  options:
    values:
      - id: post
        name: POST
      - id: get
        name: GET

formSubject:
  type: text
  comment: Value for hidden _subject field.

formRedirect:
  type: text
  comment: Value for hidden _redirect field.

reviewHeading:
  type: text
  comment: Heading shown above the review quote.

reviewText:
  type: textarea
  comment: Review body copy.

reviewerName:
  type: text
  comment: Name shown under the review.

sectionSpacingTop:
  type: text
  comment: CSS spacing token/value for top margin (e.g. 100px).

formBackgroundColor:
  type: select
  comment: Form section background color.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

reviewBackgroundColor:
  type: select
  comment: Review section background color.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
