heading:
  type: text
  comment: Section heading.

images:
  type: array
  comment: Before/after or smile result images.
  options:
    structures:
      values:
        - label: Result Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

backgroundColorHex:
  type: select
  comment: Background color of the section.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text

textColor:
  type: color
  comment: Heading text color.
