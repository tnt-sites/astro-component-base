heading:
  type: text
  comment: Main section heading.

leftTitle:
  type: text
  comment: Heading above the left list.

leftItems:
  type: array
  options:
    structures:
      values:
        - label: Left Benefit Item
          icon: check
          value: ""

rightTitle:
  type: text
  comment: Heading above the right list.

rightItems:
  type: array
  options:
    structures:
      values:
        - label: Right Benefit Item
          icon: check
          value: ""

centerImage:
  type: object
  comment: Center illustrative image between the two lists.
  options:
    structures:
      values:
        - label: Center Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

backgroundColor:
  type: select
  comment: Section background color.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

backgroundImage:
  type: object
  comment: Full section background texture/image.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
