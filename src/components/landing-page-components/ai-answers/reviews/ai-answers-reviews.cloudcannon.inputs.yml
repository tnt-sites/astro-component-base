backgroundColor:
  type: select
  comment: Background color of the reviews section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: text
  comment: Section heading. Supports <br> for manual line breaks.

image:
  type: object
  comment: Decorative image displayed beside the heading.
  options:
    structures:
      values:
        - label: Section Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

headingColor:
  type: select
  comment: Color of the section heading.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

borderColor:
  type: select
  comment: Border color for each review card.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

starColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Color of the star rating icons.

reviews:
  type: array
  comment: List of review cards to display.
  options:
    structures:
      values:
        - label: Review
          icon: rate_review
          value:
            googleLogo:
              source: ""
              alt: Google Reviews
            text: ""
            author: ""
          _inputs:
            googleLogo:
              type: object
              comment: Optional Google logo displayed above the review.
              options:
                structures:
                  values:
                    - label: Google Logo
                      icon: image
                      value:
                        source: ""
                        alt: Google Reviews
                      _inputs:
                        source:
                          type: image
                          comment: Path or URL to the Google logo image.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: text
                          comment: Alt text for the logo.
            text:
              type: textarea
              comment: The body text of the review.
            author:
              type: text
              comment: Author attribution, e.g. "- Jane D."

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
