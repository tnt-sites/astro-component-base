backgroundColor:
  type: select
  comment: Background color of the table section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
heading:
  type: text
  comment: Section heading displayed above the table. Supports <br> for line breaks.

headingLineColor:
  type: select
  comment: Color of the decorative horizontal lines flanking the heading.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

siteName:
  type: text
  comment: "Override for the practice name shown in the table header and mobile labels. Defaults to the site name from Site Info."

logo:
  type: object
  comment: Practice logo displayed in the table header column.
  options:
    structures:
      values:
        - label: Logo Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the logo image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for the logo.

headerColor:
  type: select
  comment: Background color of the table header row.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

headerTextColor:
  type: select
  comment: Text color of the table header row.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

otherColumnLabel:
  type: text
  comment: Label for the "other practices" column in the table header.

checkColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Color of the checkmark icon.

crossColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Color of the cross text.

checkIconName:
  type: select
  comment: Fontello icon to use as the checkmark.
  options:
    values:
      - id: icon-ok-circled
        name: Ok Circled
      - id: icon-ok-circle
        name: Ok Circle
      - id: icon-ok
        name: Ok
      - id: icon-ok-1
        name: Ok 1

crossText:
  type: text
  comment: "Text displayed as the cross symbol (e.g. ✕ or ✗ or No)."

rows:
  type: array
  comment: Comparison table rows. Set siteValue/otherValue to "check", "cross", or any text (e.g. a price).
  options:
    structures:
      values:
        - label: Row
          icon: table_rows
          value:
            feature: ""
            siteValue: check
            otherValue: cross
          _inputs:
            feature:
              type: text
              comment: The feature or attribute being compared.
            siteValue:
              type: select
              comment: "Value for your practice column: check, cross, or custom text."
              options:
                allow_create: true
                values:
                  - id: check
                    name: "✓ Check"
                  - id: cross
                    name: "✗ Cross"
            otherValue:
              type: select
              comment: "Value for the other practices column: check, cross, or custom text."
              options:
                allow_create: true
                values:
                  - id: check
                    name: "✓ Check"
                  - id: cross
                    name: "✗ Cross"

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
