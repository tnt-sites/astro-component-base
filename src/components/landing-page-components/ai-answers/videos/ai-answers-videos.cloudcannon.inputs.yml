backgroundColor:
  type: select
  comment: Background color of the videos section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
heading:
  type: text
  comment: Section heading. Supports <br> for manual line breaks.

headingColor:
  type: select
  comment: Color of the section heading.
  options:
    allow_empty: true
    values: _select_data.brandColors

image:
  type: object
  comment: Decorative image displayed beside the heading.
  options:
    structures:
      values:
        - label: Section Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

videos:
  type: array
  comment: Up to three videos. Supports YouTube and Vimeo embeds.
  options:
    structures:
      values:
        - label: Video
          icon: video_library
          value:
            type: youtube
            id: ""
            title: ""
          _inputs:
            type:
              type: select
              comment: Choose the video provider.
              options:
                values:
                  - id: youtube
                    name: YouTube
                  - id: vimeo
                    name: Vimeo
            id:
              type: text
              comment: Video ID only, not the full URL.
            title:
              type: text
              comment: Optional title shown below the video.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
