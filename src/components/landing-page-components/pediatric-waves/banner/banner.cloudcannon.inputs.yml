backgroundColor:
  type: select
  comment: Background color of the hero section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
subheading:
  type: text
  comment: Small text above the main hero heading.

heading:
  type: text
  comment: Main hero heading. Supports <br> line breaks.

listItems:
  type: array
  comment: Bullet points shown under the heading.
  options:
    structures:
      values:
        - label: List Item
          icon: add
          value: ""

image:
  type: object
  comment: Primary hero image shown on the right side.
  options:
    structures:
      values:
        - label: Hero Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the hero image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

buttonSections:
  type: array
  comment: Optional CTA button(s) below the bullet list.
  options:
    structures: _structures.buttonSections

headingColor:
  type: select
  comment: Color of the main heading text.
  options:
    allow_empty: true
    values: _select_data.brandColors

accentColor:
  type: select
  comment: Accent color for subheading and plus markers.
  options:
    allow_empty: true
    values: _select_data.brandColors

waveTopImage:
  type: object
  comment: Optional top decorative wave image.
  options:
    structures:
      values:
        - label: Top Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the top wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

waveMiddleImage:
  type: object
  comment: Optional middle decorative wave image.
  options:
    structures:
      values:
        - label: Middle Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the middle wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

waveBottomImage:
  type: object
  comment: Optional bottom decorative wave image.
  options:
    structures:
      values:
        - label: Bottom Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the bottom wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
