backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
heading:
  type: text
  comment: Main section heading. Supports <br> line breaks.

paragraphs:
  type: array
  comment: Body paragraphs for this split section.
  options:
    structures:
      values:
        - label: Paragraph
          icon: format_paragraph
          value:
            body: ""
          _inputs:
            body:
              type: textarea
              comment: Paragraph text. Supports inline HTML for emphasis.

image:
  type: object
  comment: Image displayed in the second column.
  options:
    structures:
      values:
        - label: Section Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional image caption.

reverse:
  type: checkbox
  comment: Move the image to the left on desktop when enabled.

buttonSections:
  type: array
  comment: Optional call-to-action button group.
  options:
    structures: _structures.buttonSections

headingColor:
  type: select
  comment: Optional heading color override.
  options:
    allow_empty: true
    values: _select_data.brandColors

accentColor:
  type: select
  comment: Accent color used for emphasized inline text.
  options:
    allow_empty: true
    values: _select_data.brandColors

waveImage:
  type: object
  comment: Optional decorative side wave image.
  options:
    structures:
      values:
        - label: Side Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the side wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
