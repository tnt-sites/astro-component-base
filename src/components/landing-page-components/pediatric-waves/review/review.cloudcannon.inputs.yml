backgroundColor:
  type: select
  comment: Background color of the testimonial section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
badgeHeading:
  type: text
  comment: Heading text shown in the left testimonial badge card. Supports <br> line breaks.

badgeSubheading:
  type: text
  comment: Small uppercase text shown under the stars.

stars:
  type: number
  comment: Number of star icons to display (0-5).

reviewText:
  type: textarea
  comment: Main testimonial body copy.

reviewerName:
  type: text
  comment: Name shown after the testimonial text.

reviewLogo:
  type: object
  comment: Optional review platform logo shown in the badge.
  options:
    structures:
      values:
        - label: Review Logo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the review platform logo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

badgeBackgroundColor:
  type: select
  comment: Background color for the left badge card.
  options:
    allow_empty: true
    values: _select_data.backgroundColors
headingColor:
  type: select
  comment: Optional heading color override.
  options:
    allow_empty: true
    values: _select_data.brandColors

waveTopImage:
  type: object
  comment: Optional top decorative wave image.
  options:
    structures:
      values:
        - label: Top Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the top wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

waveMiddleImage:
  type: object
  comment: Optional middle decorative wave image.
  options:
    structures:
      values:
        - label: Middle Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the middle wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

waveBottomImage:
  type: object
  comment: Optional bottom decorative wave image.
  options:
    structures:
      values:
        - label: Bottom Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the bottom wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
