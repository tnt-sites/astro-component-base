backgroundColor:
  type: select
  comment: Background color of the top bar.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight

items:
  type: array
  comment: Announcement items separated by bullet dots (e.g. "New Patients Welcome").
  options:
    structures:
      values:
        - label: Item
          icon: title
          value: ""

textColor:
  type: select
  comment: Text color for the top bar. Defaults to the current color scheme's text color.
  options:
    values:
      - id: "var(--color-text)"
        name: Dark (default)
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand
      - id: "var(--color-brand-secondary)"
        name: Brand Secondary
