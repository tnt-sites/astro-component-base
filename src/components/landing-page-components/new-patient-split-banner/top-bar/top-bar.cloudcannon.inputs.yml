backgroundColor:
  type: select
  comment: Background color of the top bar.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
items:
  type: array
  comment: Announcement items separated by bullet dots (e.g. "New Patients Welcome").
  options:
    structures:
      values:
        - label: Item
          icon: title
          value: ""

textColor:
  type: select
  comment: Text color for the top bar. Defaults to the current color scheme's text color.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
