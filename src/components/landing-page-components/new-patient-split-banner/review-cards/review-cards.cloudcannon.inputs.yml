backgroundColor:
  type: select
  comment: Background color of the review cards section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
reviews:
  type: array
  comment: Review cards shown in a 3-up layout on desktop and stacked on mobile.
  options:
    structures:
      values:
        - label: Review Card
          icon: reviews
          value:
            reviewText: ""
            author: ""
            stars: 5
            googleLogoImage:
              source: ""
              alt: Google logo
          _inputs:
            reviewText:
              type: textarea
              comment: Review text for this card.
            author:
              type: text
              comment: Reviewer name.
            stars:
              type: number
              comment: Number of stars to show (0-5).
            googleLogoImage:
              type: object
              comment: Google logo shown next to the reviewer details.
              options:
                structures:
                  values:
                    - label: Google Logo
                      icon: image
                      value:
                        source: ""
                        alt: Google logo
                      _inputs:
                        source:
                          type: image
                          comment: Path or URL to the Google logo image.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: text
                          comment: Alt text for accessibility.

cardBackgroundColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name
  comment: Background color of each review card.

textColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Text color used for review copy and author details.

starColor:
  type: select
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
  comment: Color used for the star rating.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
