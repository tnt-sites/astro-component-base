backgroundColor:
  type: select
  comment: Background color of the count section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
items:
  type: array
  comment: Icon + label items to display in the row (typically 3–5 items).
  options:
    structures:
      values:
        - label: Count Item
          icon: star
          value:
            image:
              source: ""
              alt: ""
            text: ""
          _inputs:
            image:
              type: object
              comment: Icon image for this item.
              options:
                structures:
                  values:
                    - label: Icon Image
                      icon: image
                      value:
                        source: ""
                        alt: ""
                      _inputs:
                        source:
                          type: image
                          comment: Path or URL to the icon image.
                          options:
                            paths:
                              uploads: src/assets/images
                              static: ""
                        alt:
                          type: textarea
                          comment: Alt text for accessibility.
            text:
              type: text
              comment: Label text below the icon. Supports <br> for line breaks.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
