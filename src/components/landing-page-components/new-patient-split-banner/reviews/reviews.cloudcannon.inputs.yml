backgroundColor:
  type: select
  comment: Background color (used as fallback if no background image is set).
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
backgroundImage:
  type: object
  comment: Full-bleed background image for the reviews section.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the background image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

heading:
  type: text
  comment: Section heading displayed above the review quote.

reviewText:
  type: textarea
  comment: The review quote text (opening/closing quotes are added automatically).

author:
  type: text
  comment: Author name displayed below the stars.

googleLogoImage:
  type: object
  comment: Optional Google logo or reviewer avatar displayed next to the author name.
  options:
    structures:
      values:
        - label: Google Logo
          icon: image
          value:
            source: ""
            alt: Google Reviews
          _inputs:
            source:
              type: image
              comment: Path or URL to the Google logo or avatar.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.

starColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: Color used for the star rating.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
