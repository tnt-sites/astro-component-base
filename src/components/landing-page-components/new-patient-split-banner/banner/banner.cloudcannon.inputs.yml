backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
subheading:
  type: text
  comment: Small uppercase text displayed above the main heading.

heading:
  type: text
  comment: Main heading text. Supports <br> for manual line breaks.

text:
  type: markdown
  comment: Optional body text displayed below the heading.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false

textBackgroundImage:
  type: image
  comment: Optional centered background image (heart) for the text panel.
  options:
    paths:
      uploads: src/assets/images
      static: ""

badgeImage:
  type: object
  comment: Optional badge or award image displayed below the heading.
  options:
    structures:
      values:
        - label: Badge Image
          icon: workspace_premium
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the badge image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

image:
  type: object
  comment: Full-bleed photo shown on the right side of the banner.
  options:
    structures:
      values:
        - label: Banner Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the photo.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption displayed over the bottom of the photo (e.g. doctor name).

buttonSections:
  type: array
  comment: Optional CTA button(s) displayed below the heading.
  options:
    structures: _structures.buttonSections

borderColor:
  type: select
  comment: Color of the decorative bottom border on the banner.
  options:
    allow_empty: true
    values: _select_data.brandColors

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
