backgroundColor:
  type: select
  comment: Background color of the split section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
headingPrefix:
  type: text
  comment: Optional small label displayed above the main heading.

heading:
  type: text
  comment: Main section heading. Supports <br> for line breaks.

listItems:
  type: array
  comment: Checklist items displayed in the article. Supports inline HTML.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

checkImage:
  type: image
  comment: Optional checkmark image used as the list bullet. Leave blank to use the default ✓ symbol.
  options:
    paths:
      uploads: src/assets/images
      static: ""

image:
  type: object
  comment: Image displayed on the opposite side of the content.
  options:
    structures:
      values:
        - label: Section Photo
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: textarea
              comment: Alt text for accessibility.

figcaption:
  type: text
  comment: Optional caption below the image.

reverse:
  type: checkbox
  comment: When enabled, the image appears on the left and text on the right.

twoColumnList:
  type: checkbox
  comment: When enabled, the list renders in two columns on desktop.

headingColor:
  type: select
  comment: Color of the main h2 heading text.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

prefixColor:
  type: select
  comment: Color of the small prefix label above the heading. Defaults to the heading color when left unset.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
