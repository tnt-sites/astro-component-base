backgroundColor:
  type: select
  comment: Background color of the outer section (the band behind the content card).
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

contentBackgroundColor:
  type: select
  comment: Background color of the inner content card (behind the form).
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

callBackgroundColor:
  type: select
  comment: Background color of the call-to-action row (photo + call text).
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

callTextColor:
  type: select
  comment: Color of the call text.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

linkColor:
  type: select
  comment: Color of the phone number link.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

image:
  type: object
  comment: Photo displayed beside the call text (typically a team or doctor photo).

image.source:
  type: image
  comment: URL or path of the call-row photo.

image.alt:
  type: text
  comment: Alt text for the call-row photo.

figcaption:
  type: text
  comment: Caption overlaid at the bottom of the photo (e.g. doctor names). Leave blank to hide.

callText:
  type: html
  comment: Full call-to-action text displayed in the call row next to the photo. Supports links, line breaks, and inline formatting.

iframeEmbed:
  type: textarea
  comment: Raw HTML embed code from CTM. Paste the full iframe and/or script tags here.

bottomText:
  type: markdown
  comment: Optional paragraph displayed below the form in the outer section background color. Supports HTML.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
