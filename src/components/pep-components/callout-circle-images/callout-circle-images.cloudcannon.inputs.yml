backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

headingColor:
  type: select
  comment: Color of the section heading.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

itemHeadingColor:
  type: select
  comment: Color of each callout item's heading text.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

circleBackgroundColor:
  type: select
  comment: Background color of the circular image container.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

heading:
  type: text
  comment: Section heading displayed above the callout items. Supports HTML (e.g. <br> for line breaks).

items:
  type: array
  comment: List of callout items, each with a circle image and a short heading.
  options:
    structures:
      values:
        - label: Callout Item
          icon: image
          value:
            image:
              source: https://placehold.co/400x400
              alt: Callout image
            heading: Callout Heading

items[*].image.source:
  type: image

items[*].image.alt:
  type: text
  comment: Alt text for the callout image.

items[*].heading:
  type: text
  comment: Short label displayed below the image. Supports <br> for line breaks.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
