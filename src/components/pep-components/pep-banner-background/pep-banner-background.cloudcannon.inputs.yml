borderColor:
  type: select
  comment: Color of the bottom border stripe. Leave blank to use the default brand color.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the H1 heading text. Leave blank to use the theme default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

textColor:
  type: select
  comment: Color of the body copy. Leave blank to inherit the component default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

heading:
  type: text
  comment: Main H1 heading. Supports <br> for manual line breaks.

text:
  type: markdown
  comment: Body copy shown over the banner. Supports bold, italic, and links.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false

dividerColor:
  type: select
  comment: Color of the horizontal rule below the text. Leave blank to use the default brand color.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

image:
  type: object
  comment: Main banner image shown on desktop.
  _inputs:
    source:
      type: image
      comment: Desktop banner image.
      options:
        paths:
          uploads: src/assets/images
          static: ""
    alt:
      type: textarea
      comment: Alt text describing the banner image for accessibility.

HeadingSpanColor:
  type: select
  comment: Color of the h1 span text. Leave blank to inherit the heading color.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

AccentWordColor:
  type: select
  comment: Color of the accented word inside the h1 span. Leave blank to use the brand color.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
