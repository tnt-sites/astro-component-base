backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

borderColor:
  type: select
  comment: Color of the bottom border stripe. Leave blank to use the default brand color.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the H1 heading text. Leave blank to use the theme default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

textColor:
  type: select
  comment: Color of the body paragraph text. Leave blank to inherit from the background color scheme.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

heading:
  type: text
  comment: Main H1 heading. Supports <br> for manual line breaks.

text:
  type: markdown
  comment: Body text displayed below the heading. Supports bold, italic, and links.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false

image:
  type: object
  comment: Full-height photo displayed on the right side of the banner.
  _inputs:
    source:
      type: image
      comment: Banner photo.
      options:
        paths:
          uploads: src/assets/images
          static: ""
    alt:
      type: textarea
      comment: Alt text describing the image for accessibility.

figcaption:
  type: text
  comment: Optional caption overlaid at the bottom of the image (e.g. doctor name).

buttonSections:
  type: array
  comment: Optional call-to-action buttons displayed below the body text.
  options:
    structures: _structures.buttonSections

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
