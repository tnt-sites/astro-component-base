backgroundColor:
  type: select
  comment: Background color of the outer section (behind the card grid).
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

headingBackgroundColor:
  type: select
  comment: Background color of the h2 heading banner. Defaults to brand secondary.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

headingTextColor:
  type: select
  comment: Text color of the h2 heading.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

oddItemBackgroundColor:
  type: select
  comment: Background color for odd-numbered callout items (1st, 3rd, 5th…). Defaults to a subtle tint.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

evenItemBackgroundColor:
  type: select
  comment: Background color for even-numbered callout items (2nd, 4th, 6th…). Defaults to white.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

itemHeadingColor:
  type: select
  comment: Color of each item's h3 label text.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

heading:
  type: text
  comment: Section heading displayed in the colored banner above the grid. Supports HTML (e.g. <br>).

items:
  type: array
  comment: List of callout items, each with an icon image and a short label.
  options:
    structures:
      values:
        - label: Callout Item
          icon: image
          value:
            image:
              source: https://placehold.co/200x110
              alt: Callout icon
            heading: Callout Heading

items[*].image.source:
  type: image

items[*].image.alt:
  type: text
  comment: Alt text for the callout icon image.

items[*].heading:
  type: text
  comment: Short label displayed below the image. Supports <br> for line breaks.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
