backgroundColor:
  type: select
  comment: Background color of the banner section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

backgroundImage:
  type: file
  comment: Optional background image asset for the banner. Image will be set to no-repeat and centered.
  accepts:
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg

backgroundPositionX:
  type: text
  comment: Horizontal position of the background image (e.g., 'center', '50%', '271px').

backgroundPositionY:
  type: text
  comment: Vertical position of the background image (e.g., '80%', 'center', '100px').

boxShadow:
  type: boolean
  comment: Optional box shadow for the banner..

topBorder:
  type: boolean
  comment: Show a thin border at the top of the banner.

borderColor:
  type: select
  comment: Color of the bottom border stripe. Leave blank to use the default brand color.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

headingColor:
  type: select
  comment: Color of the H1 heading text. Leave blank to use the theme default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

dividerColor:
  type: select
  comment: Color of the short divider under the heading. Leave blank to match the heading color.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

textColor:
  type: select
  comment: Color of the body copy. Leave blank to inherit the component default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

paddingVertical:
  type: select
  comment: The space on the top and bottom of this section.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl

heading:
  type: text
  comment: Main H1 heading. Supports <br> for manual line breaks.

contentStyle:
  type: select
  comment: Choose whether this banner shows paragraph text or a checklist with oversized checkmarks.
  options:
    values:
      - id: paragraph
        name: Paragraph
      - id: checklist
        name: Checklist

showDivider:
  type: switch
  comment: Show the short rule under the heading.

text:
  type: markdown
  comment: Centered body copy shown below the heading when Content Style is Paragraph.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false

listItems:
  type: array
  comment: Checklist items shown when Content Style is Checklist.
  options:
    structures:
      values:
        - label: List Item
          icon: check_circle
          value: ""

listItems[*]:
  type: text
  comment: Single checklist line. Supports simple inline HTML.

checkIconName:
  type: select
  comment: Icon used before each checklist line when Content Style is Checklist.
  options:
    values: _select_data.icons

checkColor:
  type: select
  comment: Color of the oversized checkmarks in checklist mode.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

checkmarkShadowColor:
  type: select
  comment: Shadow color behind checklist checkmarks.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
