backgroundColor:
  type: select
  comment: Background color of the banner section. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the background color above. Leave blank to use the theme color.

headingColor:
  type: select
  comment: Color of the H1 heading text. Leave blank to use the theme default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)

textColor:
  type: select
  comment: Color of the body copy. Leave blank to inherit the component default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)

heading:
  type: text
  comment: Main H1 heading. Supports <br> for manual line breaks.

headingFontFamily:
  type: text
  comment: Override the font family for this heading. Leave blank to use the site default. Use any font family loaded by the page, including extra fonts.

showDivider:
  type: switch
  comment: Show the short rule under the heading.

text:
  type: markdown
  comment: Centered body copy shown below the heading. Supports bold, italic, and links.
  options:
    bold: true
    italic: true
    link: true
    strike: false
    bulletedlist: false
    numberedlist: false
