backgroundColor:
  type: select
  comment: Background color of the outer section (the band behind the content card).
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color for the outer section background. Overrides the dropdown above.

contentBackgroundColor:
  type: select
  comment: Background color of the inner content card. Defaults to surface gray.
  options:
    values:
      - id: ""
        name: Default (Surface)
      - id: "var(--color-bg-surface)"
        name: Surface (Light Gray)
      - id: "var(--color-bg-base)"
        name: Base (White)
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "transparent"
        name: Transparent

contentBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the inner content card. Overrides the dropdown above.

callBackgroundColor:
  type: select
  comment: Background color of the call-to-action row (photo + phone text). Defaults to white.
  options:
    values:
      - id: ""
        name: Default (White)
      - id: "var(--color-bg-base)"
        name: Base (White)
      - id: "var(--color-bg-surface)"
        name: Surface (Light Gray)
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "var(--color-bg-brand-secondary)"
        name: Brand Secondary
      - id: "transparent"
        name: Transparent

callBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the call row background. Overrides the dropdown above.

formBackgroundColor:
  type: select
  comment: Background color behind the form inputs. Defaults to surface gray.
  options:
    values:
      - id: ""
        name: Default (Surface Gray)
      - id: "var(--color-bg-surface)"
        name: Surface (Light Gray)
      - id: "var(--color-bg-base)"
        name: Base (White)
      - id: "var(--color-bg-accent)"
        name: Accent
      - id: "var(--color-bg-highlight)"
        name: Highlight
      - id: "var(--color-bg-brand)"
        name: Brand
      - id: "transparent"
        name: Transparent

formBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the form area background. Overrides the dropdown above.

submitBackgroundColor:
  type: select
  comment: Background color of the submit button. Defaults to brand.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "#95982d"
        name: Olive Green
      - id: "#4a7290"
        name: Steel Blue
      - id: "#000000"
        name: Black

submitBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the submit button. Overrides the dropdown above.

linkColor:
  type: select
  comment: Color of the phone number link in the call row.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "#95982d"
        name: Olive Green

image:
  type: object
  comment: Photo displayed beside the call text.

image.source:
  type: image

image.alt:
  type: text
  comment: Alt text for the call-row photo.

figcaption:
  type: text
  comment: Caption overlaid at the bottom of the photo (e.g. doctor names). Leave blank to hide.

callText:
  type: markdown
  comment: Text displayed in the call row next to the photo. Use **bold** and line breaks as needed.

phone:
  type: text
  comment: Phone number digits (e.g. 9042720800 or (904) 272-0800). Used for the tel: href.

phoneLabel:
  type: text
  comment: Display text for the phone link (e.g. "(904) 272-0800"). Defaults to the phone value.

formAction:
  type: text
  comment: Form submission URL or relative path.

nameLabel:
  type: text
  comment: Label for the Name field.

phoneFieldLabel:
  type: text
  comment: Label for the Phone Number field.

emailLabel:
  type: text
  comment: Label for the Email Address field.

timesLabel:
  type: text
  comment: Legend/title for the preferred appointment time checkboxes.

timeOptions:
  type: array
  comment: Checkbox options for preferred appointment times.
  options:
    structures:
      values:
        - label: Time Option
          icon: schedule
          value:
            label: Morning
            value: morning

timeOptions[*].label:
  type: text
  comment: Display label for this time option.

timeOptions[*].value:
  type: text
  comment: Form value submitted for this time option.

commentsLabel:
  type: text
  comment: Label for the Questions/Comments textarea.

submitText:
  type: text
  comment: Text on the submit button.

bottomText:
  type: markdown
  comment: Optional paragraph displayed below the form over the outer section background.
