backgroundColor:
  type: select
  comment: Background color of the outer section (the band behind the content card).
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color for the outer section background. Overrides the dropdown above.

contentBackgroundColor:
  type: select
  comment: Background color of the inner content card.
  options:
    values:
      - id: ""
        name: Default
      - id: none
        name: None (Transparent)
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

contentBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the inner content card. Overrides the dropdown above.

callBackgroundColor:
  type: select
  comment: Background color of the call-to-action row (photo + call text).
  options:
    values:
      - id: ""
        name: Default
      - id: none
        name: None (Transparent)
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

callBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the call row background. Overrides the dropdown above.

formBackgroundColor:
  type: select
  comment: Background color behind the form inputs.
  options:
    values:
      - id: ""
        name: Default
      - id: none
        name: None (Transparent)
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

formBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the form area background. Overrides the dropdown above.

submitBackgroundColor:
  type: select
  comment: Background color of the submit button.
  options:
    values:
      - id: ""
        name: Default
      - id: none
        name: None (Transparent)
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

submitBackgroundColorHex:
  type: color
  comment: Optional custom hex color for the submit button. Overrides the dropdown above.

linkColor:
  type: select
  comment: Color of the phone number link in the call row.
  options:
    values:
      - id: ""
        name: Default (Brand)
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "#95982d"
        name: Olive Green

image:
  type: object
  comment: Photo displayed beside the call text.

image.source:
  type: image

image.alt:
  type: text
  comment: Alt text for the call-row photo.

figcaption:
  type: text
  comment: Caption overlaid at the bottom of the photo (e.g. doctor names). Leave blank to hide.

callText:
  type: html
  comment: Full call-to-action text displayed in the call row next to the photo. Supports links, line breaks, and inline formatting. Include the phone number as a linked anchor (e.g. <a href="tel:+19042720800">(904) 272-0800</a>).

formAction:
  type: text
  comment: Form submission URL or relative path.

nameLabel:
  type: text
  comment: Label for the Name field.

phoneFieldLabel:
  type: text
  comment: Label for the Phone Number field.

emailLabel:
  type: text
  comment: Label for the Email Address field.

timesLabel:
  type: text
  comment: Legend/title for the preferred appointment time checkboxes.

timeOptions:
  type: array
  comment: Checkbox options for preferred appointment times.
  options:
    structures:
      values:
        - label: Time Option
          icon: schedule
          value:
            label: Morning
            value: morning

timeOptions[*].label:
  type: text
  comment: Display label for this time option.

timeOptions[*].value:
  type: text
  comment: Form value submitted for this time option.

commentsLabel:
  type: text
  comment: Label for the Questions/Comments textarea.

submitText:
  type: text
  comment: Text on the submit button.

bottomText:
  type: markdown
  comment: Optional paragraph displayed below the form over the outer section background.
