heading:
  type: text
  comment: Main heading for the callout section. Supports <br> for manual line breaks.

headingBackgroundColor:
  type: select
  comment: Background color for the heading. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

headingBackgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the heading background color above. Leave blank to use the theme color.

headingTextColor:
  type: select
  comment: Color of the heading text. Leave blank to use the theme default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

oddItemBackgroundColor:
  type: select
  comment: Background color for odd callout items. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

oddItemBackgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the odd item background color above. Leave blank to use the theme color.

evenItemBackgroundColor:
  type: select
  comment: Background color for even callout items. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

evenItemBackgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the even item background color above. Leave blank to use the theme color.

itemHeadingColor:
  type: select
  comment: Color of the callout item headings. Leave blank to use the default.
  options:
    values:
      - id: ""
        name: Default
      - id: "var(--color-text)"
        name: Dark
      - id: "var(--color-text-inverse)"
        name: White
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-brand-muted)"
        name: Brand (Tertiary)

backgroundColor:
  type: select
  comment: Background color for the section. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the section background color above. Leave blank to use the theme color.

items:
  type: array
  label: Callout Items
  comment: List of callout items to display. Each item can have an image and a heading.
  _inputs:
    image:
      type: object
      label: Image
      _inputs:
        source:
          type: image
          comment: Callout image.
          options:
            paths:
              uploads: src/assets/images
              static: ""
        alt:
          type: textarea
          comment: Alt text for the image.
    heading:
      type: text
      comment: Heading for the callout item.
