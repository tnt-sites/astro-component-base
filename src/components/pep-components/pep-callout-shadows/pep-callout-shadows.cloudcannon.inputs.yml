heading:
  type: text
  comment: Main heading for the callout section. Supports <br> for manual line breaks.

headingBackgroundColor:
  type: select
  comment: Background color for the heading. Choose a theme color or use the hex override below for a custom color.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

  comment: Color of the callout item headings. Leave blank to use the default.
    values:

shadowColor:
  type: select
  comment: Color of the card shadow. Choose a theme color or use a preset.
  options:
    values:
      - id: rgba(0,0,0,0.10)
        name: Default (Light Shadow)
      - id: rgba(0,0,0,0.20)
        name: Darker Shadow
      - id: var(--color-brand)
        name: Brand Color
      - id: var(--color-accent)
        name: Accent Color
      - id: #00000033
        name: Black 20%
      - id: #00000055
        name: Black 33%
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: dark
        name: Dark
      - id: black
        name: Black

backgroundColorHex:
  type: color
  comment: Optional custom hex color that overrides the section background color above. Leave blank to use the theme color.

items:
  type: array
  label: Callout Items
  comment: List of callout items to display. Each item can have an image and a heading.
  _inputs:
    image:
      type: object
      label: Image
      _inputs:
        source:
          type: image
          comment: Callout image.
          options:
            paths:
              uploads: src/assets/images
              static: ""
        alt:
          type: textarea
          comment: Alt text for the image.
    heading:
      type: text
      comment: Heading for the callout item.
