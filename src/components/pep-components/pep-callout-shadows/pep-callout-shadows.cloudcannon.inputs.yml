heading:
  type: text
  comment: Main heading for the callout section. Supports <br> for manual line breaks.

headingBackgroundColor:
  type: select
  comment: Background color for the heading.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

headingTextColor:
  type: select
  comment: Color of the main heading text. Leave blank for the default (inverse text).
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

itemHeadingColor:
  type: select
  comment: Color of each card's heading. Leave blank for the default text color.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

shadowColor:
  type: select
  comment: Color of the card shadow. Uses the same color tokens as headings. Choose a theme color or use a preset.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

backgroundColor:
  type: select
  comment: Background color of the section.
  options:
    allow_empty: true
    values: _select_data.sectionBackgrounds

items:
  type: array
  label: Callout Items
  comment: List of callout items to display. Each item can have an image and a heading.
  _inputs:
    image:
      type: object
      label: Image
      _inputs:
        source:
          type: image
          comment: Callout image.
          options:
            paths:
              uploads: src/assets/images
              static: ""
        alt:
          type: textarea
          comment: Alt text for the image.
    heading:
      type: text
      comment: Heading for the callout item.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
