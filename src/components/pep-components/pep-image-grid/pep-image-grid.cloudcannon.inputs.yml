backgroundColor:
  type: select
  comment: Background color of the outer section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name

paddingVertical:
  type: select
  comment: Vertical spacing above and below the grid.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2XL

cardBackgroundColor:
  type: select
  comment: Background color behind each image or video tile.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name

captionBackgroundColor:
  type: select
  comment: Background color behind each figcaption.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name

captionTextColor:
  type: select
  comment: Text color of each figcaption.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name

heading:
  type: text
  comment: Optional section heading above the grid. Supports simple HTML such as <br>.

items:
  type: array
  comment: Add two or more image or YouTube tiles.
  options:
    structures:
      values:
        - label: Grid Item
          icon: image
          value:
            mediaType: image
            image:
              source: https://placehold.co/800x800
              alt: Grid image
            youtubeId: ""
            youtubeTitle: ""
            caption: Sample Caption

items[*].mediaType:
  type: select
  comment: Choose whether this tile is a static image or a YouTube video.
  options:
    values:
      - id: image
        name: Image
      - id: youtube
        name: YouTube Video

items[*].image.source:
  type: image
  comment: Image source used when media type is Image.

items[*].image.alt:
  type: text
  comment: Alt text for the image tile.

items[*].youtubeId:
  type: text
  comment: YouTube video ID only, for example qirqwHB1ObQ.

items[*].youtubeTitle:
  type: text
  comment: Accessible title for the YouTube embed.

items[*].caption:
  type: text
  comment: Centered uppercase figcaption shown below the media.

fontHeadings:
  type: select
  comment: Heading font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name

fontBody:
  type: select
  comment: Body text font for this section. Leave blank to use the site font. Devs add fonts in src/data/fonts.json.
  options:
    allow_empty: true
    values: data.fonts
    value_key: id
    preview:
      text:
        - key: name
