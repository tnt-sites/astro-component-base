logoSource:
  type: image
  comment: "Logo image source URL or path. Leave empty to hide the logo."
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
offices:
  type: array
  comment: "Optional office contact override for the navigation bar. Leave empty to use siteInfo offices."
  options:
    structures: _structures.officeSections
"$.offices[*].name":
  type: text
  comment: "Optional office label."
"$.offices[*].phones[*].display":
  type: text
  comment: "Phone number as displayed (e.g. (123) 456-7890)."
"$.offices[*].phones[*].href":
  type: text
  comment: "Phone href value (e.g. tel:+11234567890)."
"$.offices[*].addresses[*].lines":
  type: array
  comment: "Street address lines."
"$.offices[*].addresses[*].city":
  type: text
"$.offices[*].addresses[*].state":
  type: text
"$.offices[*].addresses[*].postalCode":
  type: text
"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: "Google Maps link for the address."
"$.offices[*].officeHours":
  type: array
  comment: "Office hours entries."
"$.offices[*].officeHours[*].day":
  type: text
"$.offices[*].officeHours[*].hours":
  type: text
"$.offices[*].officeHoursNote":
  type: text
  comment: "Optional note displayed below the hours list."
navData:
  type: array
  comment: "Array of navigation items to render in the navigation bar."
  options:
    structures: _structures.navData
buttonSections:
  type: array
  comment: "Buttons shown with the main navigation row (e.g. search icon button)."
  options:
    structures: _structures.buttonSections
pageButtons:
  type: array
  comment: "Page Buttons shown to the right of the main navigation. Delete all to hide this area."
  options:
    structures: _structures.buttonSections
