logoSource:
  type: image
  comment: Logo image source URL or path.

logoAlt:
  type: text
  comment: Alt text for the logo image.

id:
  type: text
  comment: Optional HTML id attribute.

contactTitle:
  type: markdown
  comment: Contact column heading. Supports inline emphasis styles.
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: false
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css

offices:
  type: array
  comment: Optional office contact override for this footer.
  options:
    structures: _structures.officeSections

legalLinks:
  type: array
  comment: Legal links displayed in the copyright row.

legalBlurb:
  type: textarea
  comment: Optional legal or compliance text shown under copyright.

linkColor:
  type: select
  comment: Color of copyright row links.
  options:
    values:
      - id: none
        name: None (default)
      - id: white
        name: White
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: text
        name: Text
      - id: text-strong
        name: Text (Strong)
      - id: text-inverse
        name: Text (Inverse)

linkHoverColor:
  type: select
  comment: Color of copyright row links on hover.
  options:
    values:
      - id: none
        name: None (default)
      - id: white
        name: White
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: text
        name: Text
      - id: text-strong
        name: Text (Strong)
      - id: text-inverse
        name: Text (Inverse)

formHeading:
  type: text
  comment: Heading above the footer form.

formAction:
  type: text
  comment: Form action URL.

formBlocks:
  type: array
  label: Form Fields
  comment: Form fields rendered by the Astro/CloudCannon form builder.
  options:
    structures: _structures.formBlocks

formMethod:
  type: select
  comment: Form submission method.
  options:
    values:
      - id: post
        name: POST
      - id: get
        name: GET

formSubject:
  type: text
  comment: Hidden subject value sent with the form.

formRedirect:
  type: text
  comment: Hidden redirect URL sent with the form.

formButtonBorderRadius:
  type: text
  comment: Submit button border radius (e.g. 0px, 8px, 999px).

formButtonTextColor:
  type: color
  comment: Submit button text color.

formButtonBackgroundColor:
  type: color
  comment: Submit button background color.

formButtonHoverBackgroundColor:
  type: color
  comment: Submit button hover background color.

formButtonHoverTextColor:
  type: color
  comment: Submit button hover text color.

formButton:
  type: object
  comment: Submit button configuration using the standard button component.
  options:
    structures:
      values:
        - label: Form Button
          icon: ads_click
          value:
            _component: building-blocks/core-elements/button
            text: Send
            hideText: false
            iconName: ""
            iconPosition: before
            variant: primary
            size: md
            width: md
            borderRadius: default
            borderWidth: default
            borderColor: default
            textColor: default
            uppercase: true
          _inputs:
            text:
              type: markdown
              comment: Button label text.
              options:
                blockquote: false
                bold: true
                format: span
                italic: true
                link: false
                strike: false
                subscript: true
                superscript: true
                underline: true
                bulletedlist: false
                numberedlist: false
                styles: /.cloudcannon/styles/editor.css
            iconName:
              type: select
              options:
                values: _select_data.icons
            iconPosition:
              type: select
              options:
                values:
                  - id: before
                    name: Before
                  - id: after
                    name: After
            hideText:
              type: switch
            variant:
              type: select
              options:
                values:
                  - id: primary
                    name: Primary
                  - id: secondary
                    name: Secondary
                  - id: tertiary
                    name: Tertiary
                  - id: ghost
                    name: Ghost
                  - id: text
                    name: Text
            size:
              type: select
              options:
                values:
                  - id: sm
                    name: Small
                  - id: md
                    name: Medium
                  - id: lg
                    name: Large
            width:
              type: select
              options:
                values:
                  - id: none
                    name: None
                  - id: sm
                    name: Small
                  - id: md
                    name: Medium
                  - id: lg
                    name: Large
                  - id: xl
                    name: Extra Large
            borderRadius:
              type: select
              options:
                values:
                  - id: default
                    name: Default
                  - id: none
                    name: None
                  - id: xs
                    name: Extra Small
                  - id: sm
                    name: Small
                  - id: md
                    name: Medium
                  - id: lg
                    name: Large
                  - id: xl
                    name: Extra Large
                  - id: 2xl
                    name: 2XL
                  - id: 3xl
                    name: 3XL
                  - id: 4xl
                    name: 4XL
                  - id: full
                    name: Full
            borderWidth:
              type: select
              options:
                values:
                  - id: default
                    name: Default
                  - id: none
                    name: None
                  - id: xs
                    name: 1px
                  - id: sm
                    name: 2px
                  - id: md
                    name: 3px
            borderColor:
              type: select
              options:
                values:
                  - id: default
                    name: Default
                  - id: standard
                    name: Standard
                  - id: subtle
                    name: Subtle
                  - id: strong
                    name: Strong
                  - id: brand
                    name: Brand
                  - id: transparent
                    name: Transparent
            textColor:
              type: select
              options:
                values:
                  - id: default
                    name: Default
                  - id: text
                    name: Body Text
                  - id: text-strong
                    name: Strong Text
                  - id: text-muted
                    name: Muted Text
                  - id: brand
                    name: Brand
                  - id: text-on-brand
                    name: On Brand
                  - id: text-inverse
                    name: Inverse
            uppercase:
              type: switch

mapEmbedUrl:
  type: text
  comment: Optional Google Maps embed URL (iframe src value).

questionsLine:
  type: text
  comment: Optional line shown below footer legal text.

backgroundColor:
  type: select
  comment: Background color of the footer.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
      - id: brand
        name: Brand (Primary)
      - id: brand-secondary
        name: Brand (Secondary)
      - id: dark
        name: Dark
      - id: black
        name: Black

officeHoursAlignment:
  type: select
  comment: Align hours text within each office-hours row while keeping the day and time columns aligned.
  options:
    values:
      - id: right
        name: Right aligned hours
      - id: left
        name: Left aligned hours

topWaveImage:
  type: object
  comment: Optional top decorative wave image shown above the footer content.
  options:
    structures:
      values:
        - label: Top Wave Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              comment: Path or URL to the top wave image.
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text
              comment: Alt text for accessibility.
