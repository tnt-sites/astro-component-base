logoSource:
  type: image
  comment: "Logo image source URL or path."
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this header section."
pageButtons:
  type: array
  comment: "Header CTA buttons shown on the right."
  options:
    structures: _structures.buttonSections
offices:
  type: array
  comment: "Optional office contact override for this page. Leave empty to use siteInfo offices."
  options:
    structures: _structures.officeSections
mobileCallSmallText:
  type: text
  comment: "Small label above the phone number in the mobile call button."
mobileRequestLabel:
  type: text
  comment: "Label for the appointment button in the mobile bar."
mobileRequestHref:
  type: text
  comment: "Link for the mobile appointment button."
mobileCallBackgroundColor:
  type: select
  comment: "Background color of the mobile call button."
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name
mobileRequestBackgroundColor:
  type: select
  comment: "Background color of the mobile request button."
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name
mobileCallTextColor:
  type: select
  comment: "Main text color of the mobile call button."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
mobileCallSmallTextColor:
  type: select
  comment: "Small text color of the mobile call button."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
mobileRequestTextColor:
  type: select
  comment: "Main text color of the mobile request button."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
mobileRequestSmallTextColor:
  type: select
  comment: "Small text color of the mobile request button."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
addressLinkColor:
  type: select
  comment: "Color of address links in the desktop header."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
addressLinkHoverColor:
  type: select
  comment: "Hover color of address links in the desktop header."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
phoneLinkColor:
  type: select
  comment: "Color of phone links in the desktop header."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
phoneLinkHoverColor:
  type: select
  comment: "Hover color of phone links in the desktop header."
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
"$.offices[*].name":
  type: text
  comment: "Optional office label."
"$.offices[*].phones[*].display":
  type: text
  comment: "Phone number as displayed (e.g. (123) 456-7890)."
"$.offices[*].phones[*].href":
  type: text
  comment: "Phone href value (e.g. tel:+11234567890)."
"$.offices[*].addresses[*].lines":
  type: array
  comment: "Street address lines."
"$.offices[*].addresses[*].city":
  type: text
"$.offices[*].addresses[*].state":
  type: text
"$.offices[*].addresses[*].postalCode":
  type: text
"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: "Google Maps link for the address."
