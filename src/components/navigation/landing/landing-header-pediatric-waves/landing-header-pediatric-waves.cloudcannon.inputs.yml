logoSource:
  type: image
  comment: Logo image source URL or path.

logoAlt:
  type: text
  comment: Alt text for the logo image.

id:
  type: text
  comment: Optional HTML id attribute.

pageButtons:
  type: array
  comment: Desktop CTA buttons displayed on the right.
  options:
    structures: _structures.buttonSections

offices:
  type: array
  comment: Optional office contact override for this page.
  options:
    structures: _structures.officeSections

mobileCallLabel:
  type: text
  comment: Label shown in the mobile call button.

mobileMapLabel:
  type: text
  comment: Label shown in the mobile map button.

mobileMapHref:
  type: text
  comment: Optional custom map URL for the mobile map button.

mobileBarBackground:
  type: color
  comment: Optional background color behind the mobile action bar.

mobileCallBackground:
  type: color
  comment: Mobile call button background color.

mobileApptBackground:
  type: color
  comment: Mobile appointment button background color.

mobileMapBackground:
  type: color
  comment: Mobile map button background color.
addressLinkColor:
  type: select
  comment: Color of address links.
  options:
    values:
      - id: ""
        name: Default (Text)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "#0d5f78"
        name: Pediatric Teal
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
addressLinkHoverColor:
  type: select
  comment: Hover color of address links.
  options:
    values:
      - id: ""
        name: Default (Link Hover)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "#0d5f78"
        name: Pediatric Teal
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-link-hover)"
        name: Link Hover
phoneLinkColor:
  type: select
  comment: Color of phone links.
  options:
    values:
      - id: ""
        name: Default (Pediatric Teal)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "#0d5f78"
        name: Pediatric Teal
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-text)"
        name: Text
phoneLinkHoverColor:
  type: select
  comment: Hover color of phone links.
  options:
    values:
      - id: ""
        name: Default (Pediatric Teal)
      - id: "#fff"
        name: White
      - id: "#000"
        name: Black
      - id: "#0d5f78"
        name: Pediatric Teal
      - id: "var(--color-brand)"
        name: Brand (Primary)
      - id: "var(--color-brand-secondary)"
        name: Brand (Secondary)
      - id: "var(--color-link-hover)"
        name: Link Hover

"$.offices[*].name":
  type: text
  comment: Optional office label.

"$.offices[*].phones[*].display":
  type: text
  comment: Phone number as displayed (e.g. (123) 456-7890).

"$.offices[*].phones[*].href":
  type: text
  comment: Phone href value (e.g. tel:+11234567890).

"$.offices[*].addresses[*].lines":
  type: array
  comment: Street address lines.

"$.offices[*].addresses[*].city":
  type: text

"$.offices[*].addresses[*].state":
  type: text

"$.offices[*].addresses[*].postalCode":
  type: text

"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: Google Maps link for the address.
