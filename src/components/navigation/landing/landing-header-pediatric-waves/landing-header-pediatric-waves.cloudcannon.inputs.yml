logoSource:
  type: image
  comment: Logo image source URL or path.

logoAlt:
  type: text
  comment: Alt text for the logo image.

id:
  type: text
  comment: Optional HTML id attribute.

pageButtons:
  type: array
  comment: Desktop CTA buttons displayed on the right.
  options:
    structures: _structures.buttonSections

offices:
  type: array
  comment: Optional office contact override for this page.
  options:
    structures: _structures.officeSections

mobileCallLabel:
  type: text
  comment: Label shown in the mobile call button.

mobileRequestLabel:
  type: text
  comment: Label shown in the mobile request button.

mobileRequestHref:
  type: text
  comment: Optional custom URL for the mobile request button.

mobileBarBackground:
  type: select
  comment: Optional background color behind the mobile action bar.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

mobileCallBackground:
  type: select
  comment: Mobile call button background color.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name

mobileRequestBackground:
  type: select
  comment: Mobile request button background color.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name
mobileCallTextColor:
  type: select
  comment: Main text color of the mobile call button.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
mobileCallSmallTextColor:
  type: select
  comment: Small text color of the mobile call button.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
mobileRequestTextColor:
  type: select
  comment: Main text color of the mobile request button.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
mobileRequestSmallTextColor:
  type: select
  comment: Small text color of the mobile request button.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

addressLinkColor:
  type: select
  comment: Color of address links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
addressLinkHoverColor:
  type: select
  comment: Hover color of address links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
phoneLinkColor:
  type: select
  comment: Color of phone links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
phoneLinkHoverColor:
  type: select
  comment: Hover color of phone links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name

"$.offices[*].name":
  type: text
  comment: Optional office label.

"$.offices[*].phones[*].display":
  type: text
  comment: Phone number as displayed (e.g. (123) 456-7890).

"$.offices[*].phones[*].href":
  type: text
  comment: Phone href value (e.g. tel:+11234567890).

"$.offices[*].addresses[*].lines":
  type: array
  comment: Street address lines.

"$.offices[*].addresses[*].city":
  type: text

"$.offices[*].addresses[*].state":
  type: text

"$.offices[*].addresses[*].postalCode":
  type: text

"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: Google Maps link for the address.
