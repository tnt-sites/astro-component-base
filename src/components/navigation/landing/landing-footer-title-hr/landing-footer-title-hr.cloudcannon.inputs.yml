id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this footer section."
siteName:
  type: text
  comment: "Business or site name used in the copyright line. Leave blank to use siteInfo."
logoSource:
  type: image
  comment: "Logo image displayed in the contact column."
logoAlt:
  type: text
  comment: "Alt text for the logo image."
contactTitle:
  type: text
  comment: "Heading for the contact column (e.g. Contact Us)."
findUsTitle:
  type: text
  comment: "Heading for the map column (e.g. Find Us)."
officeHoursTitle:
  type: text
  comment: "Heading for the office hours column (e.g. Office Hours)."
offices:
  type: array
  comment: "Optional office contact override. Leave empty to use siteInfo offices."
  options:
    structures: _structures.officeSections
"$.offices[*].name":
  type: text
  comment: "Optional office label."
"$.offices[*].phones[*].display":
  type: text
  comment: "Phone number as displayed (e.g. (123) 456-7890)."
"$.offices[*].phones[*].href":
  type: text
  comment: "Phone href value (e.g. tel:+11234567890)."
"$.offices[*].addresses[*].lines":
  type: array
  comment: "Street address lines."
"$.offices[*].addresses[*].city":
  type: text
"$.offices[*].addresses[*].state":
  type: text
"$.offices[*].addresses[*].postalCode":
  type: text
"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: "Google Maps link for the address."
"$.offices[*].officeHours":
  type: array
  comment: "Office hours entries."
"$.offices[*].officeHours[*].day":
  type: text
"$.offices[*].officeHours[*].hours":
  type: text
"$.offices[*].officeHoursNote":
  type: text
  comment: "Optional note displayed below the hours list."
mapEmbedUrl:
  type: text
  comment: "Google Maps embed URL (the iframe src value). Leave blank to hide the map column."
officeHoursNote:
  type: text
  comment: "Note displayed below the office hours list. Falls back to the office data note if blank."
officeHoursAlignment:
  type: select
  comment: "Align hours text within each office-hours row while keeping the day and time columns aligned."
  options:
    values:
      - id: right
        name: Right aligned hours
      - id: left
        name: Left aligned hours
legalLinks:
  type: array
  comment: "Legal links shown in the footer copyright row."
legalBlurb:
  type: textarea
  comment: "Optional legal/disclaimer text shown below the copyright row."
linkColor:
  type: select
  comment: "Color of copyright row links."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
linkHoverColor:
  type: select
  comment: "Color of copyright row links on hover."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
addressLinkColor:
  type: select
  comment: "Color of address links."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
addressLinkHoverColor:
  type: select
  comment: "Color of address links on hover."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
phoneLinkColor:
  type: select
  comment: "Color of phone links."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
phoneLinkHoverColor:
  type: select
  comment: "Color of phone links on hover."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
backgroundColor:
  type: select
  comment: "Footer background color."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
headingColor:
  type: select
  comment: "Color applied to the h3 headings and hr dividers in each column."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
