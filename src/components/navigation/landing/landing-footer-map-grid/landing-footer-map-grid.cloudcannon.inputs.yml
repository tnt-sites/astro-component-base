heading:
  type: text
  comment: "Heading displayed above the map grid."
siteName:
  type: text
  comment: "Business or site name used in the copyright line."
id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this footer section."
offices:
  type: array
  comment: "Office locations to override siteInfo. Leave empty to use siteInfo offices."
  options:
    structures: _structures.officeWithMapSections
"$.offices[*].name":
  type: text
  comment: "Optional office name label."
"$.offices[*].mapEmbedUrl":
  type: text
  comment: "Google Maps embed URL — paste the iframe src value here."
"$.offices[*].phones[*].display":
  type: text
  comment: "Phone number as displayed (e.g. (718) 280-3286)."
"$.offices[*].phones[*].href":
  type: text
  comment: "Phone href value (e.g. tel:+17182803286)."
"$.offices[*].addresses[*].lines":
  type: array
  comment: "Street address lines."
"$.offices[*].addresses[*].city":
  type: text
  comment: "City."
"$.offices[*].addresses[*].state":
  type: text
  comment: "State or province abbreviation."
"$.offices[*].addresses[*].postalCode":
  type: text
  comment: "ZIP or postal code."
"$.offices[*].addresses[*].country":
  type: text
  comment: "Country (leave blank if not needed)."
"$.offices[*].addresses[*].mapUrl":
  type: url
  comment: "Link URL when the address is clicked (e.g. Google Maps share link)."
legalLinks:
  type: array
  comment: "Legal links shown in the footer copyright bar."
"$.legalLinks[*].name":
  type: text
  comment: "Link label text."
"$.legalLinks[*].path":
  type: url
  comment: "URL for this legal link."
legalBlurb:
  type: textarea
  comment: "Optional fine-print disclaimer shown beneath the copyright bar."
backgroundColor:
  type: select
  comment: Background color of the footer section.
  options:
    allow_empty: true
    values: data.colors.backgrounds
    value_key: id
    preview:
      text:
        - key: name
headingColor:
  type: select
  comment: Color of the headings in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
linkColor:
  type: select
  comment: Color of phone number links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
linkHoverColor:
  type: select
  comment: Color of phone number and address links on hover.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
addressLinkColor:
  type: select
  comment: Color of address links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
addressLinkHoverColor:
  type: select
  comment: Color of address links on hover.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
phoneLinkColor:
  type: select
  comment: Color of phone links.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
phoneLinkHoverColor:
  type: select
  comment: Color of phone links on hover.
  options:
    allow_empty: true
    values: data.colors.text
    value_key: id
    preview:
      text:
        - key: name
