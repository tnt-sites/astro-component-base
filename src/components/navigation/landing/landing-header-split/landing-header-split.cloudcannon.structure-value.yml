label: Landing Header Split
icon: view_column
description: "Landing header with contact on the left, centered logo, and CTA buttons on the right."
value:
  _component: navigation/landing/landing-header-split
  logoSource: /images/logo.svg
  logoAlt: Logo
  mobileCallSmallText: "Call Today!"
  mobileApptLabel: "Request an Appointment"
  mobileApptHref: ""
  mobileCallBackgroundColor: ""
  mobileCallBackgroundColorHex: ""
  mobileApptBackgroundColor: ""
  mobileApptBackgroundColorHex: ""
  addressLinkColor: ""
  addressLinkHoverColor: ""
  phoneLinkColor: ""
  phoneLinkHoverColor: ""
  pageButtons:
    - _component: building-blocks/core-elements/button
      text: Request an Appointment
      hideText: false
      link: /request-an-appointment/
      iconName: ""
      iconPosition: before
      variant: primary
      size: md
      width: md
  offices: []
preview:
  text:
    - Landing Header Split
  icon: view_column
picker_preview:
  text: Landing Header Split
  subtext: "Contact left, centered logo, CTA right."
  icon: view_column
_inputs:
  logoSource:
    type: image
    comment: "Logo image source URL or path."
  logoAlt:
    type: text
    comment: "Alt text for the logo image for accessibility."
  mobileCallSmallText:
    type: text
    comment: "Small label above the phone number in the mobile call button."
  mobileApptLabel:
    type: text
    comment: "Label for the appointment button in the mobile bar."
  mobileApptHref:
    type: text
    comment: "Link for the mobile appointment button."
  mobileCallBackgroundColor:
    type: select
    comment: "Background color of the mobile call button."
    options:
      values:
        - id: ""
          name: Default (Brand Secondary)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileCallBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for the mobile call button. Overrides the dropdown above."
  mobileApptBackgroundColor:
    type: select
    comment: "Background color of the mobile request button."
    options:
      values:
        - id: ""
          name: Default (Brand Primary)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileApptBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for the mobile request button. Overrides the dropdown above."
  id:
    type: text
    comment: "Developer use only. Optional HTML id attribute for this header section."
  pageButtons:
    type: array
    comment: "Header CTA buttons shown on the right."
    options:
      structures: _structures.buttonSections
  offices:
    type: array
    comment: "Optional office contact override for this page. Leave empty to use siteInfo offices."
    options:
      structures: _structures.officeSections
  "$.offices[*].name":
    type: text
    comment: "Optional office label."
  "$.offices[*].phones[*].display":
    type: text
    comment: "Phone number as displayed (e.g. (123) 456-7890)."
  "$.offices[*].phones[*].href":
    type: text
    comment: "Phone href value (e.g. tel:+11234567890)."
  "$.offices[*].addresses[*].lines":
    type: array
    comment: "Street address lines."
  "$.offices[*].addresses[*].city":
    type: text
  "$.offices[*].addresses[*].state":
    type: text
  "$.offices[*].addresses[*].postalCode":
    type: text
  "$.offices[*].addresses[*].mapUrl":
    type: url
    comment: "Google Maps link for the address."
