logoSource:
  type: image
  comment: "Logo image source URL or path."
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this footer section."
siteName:
  type: text
  comment: "Business or site name used in legal copy."
contactTitle:
  type: markdown
  comment: "Heading for the contact area. Supports inline span wrappers/classes for highlighted words."
  options:
    blockquote: false
    bold: true
    format: p
    italic: true
    link: false
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
    styles: /.cloudcannon/styles/editor.css
offices:
  type: array
  comment: "Optional office contact override for this landing footer."
  options:
    structures: _structures.officeSections
pageButtons:
  type: array
  comment: "Optional CTA buttons shown near the logo."
  options:
    structures: _structures.buttonSections
socials:
  type: array
  comment: "Social links or icons for this landing footer."
legalLinks:
  type: array
  comment: "Legal links displayed in the footer legal row."
mapEmbedUrl:
  type: text
  comment: "Optional Google Maps embed URL (iframe src value)."
backgroundImage:
  type: object
  comment: Background image configuration for the footer section.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Background Image
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
backgroundImage.source:
  comment: URL or path to the background image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
backgroundImage.alt:
  comment: Alt text for the background image.
  type: textarea
backgroundImage.positionVertical:
  comment: Vertical position of the background image.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
backgroundImage.positionHorizontal:
  comment: Horizontal position of the background image.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
backgroundGradient:
  type: text
  comment: "Optional CSS gradient value layered over background (e.g. linear-gradient(...))."
cardBackgroundColor:
  type: select
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
  comment: "Optional card background color for the overlapping contact card."
backgroundColor:
  type: select
  comment: Background color of the footer section.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
officeHoursAlignment:
  type: select
  comment: "Align hours text within each office-hours row while keeping the day and time columns aligned."
  options:
    values:
      - id: right
        name: Right aligned hours
      - id: left
        name: Left aligned hours
linkColor:
  type: select
  comment: Color of phone number and address links.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
linkHoverColor:
  type: select
  comment: Color of phone number and address links on hover.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
legalBlurb:
  type: textarea
  comment: "Optional legal/disclaimer text shown below the copyright row."
addressLinkColor:
  type: select
  comment: "Color of address links."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
addressLinkHoverColor:
  type: select
  comment: "Color of address links on hover."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
phoneLinkColor:
  type: select
  comment: "Color of phone links."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
phoneLinkHoverColor:
  type: select
  comment: "Color of phone links on hover."
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
