  logoSource: /images/logo.svg
  logoAlt: Logo
  mobileCallLabel: Call Now
  mobileCallSmallText: "Call Now"
  mobileRequestLabel: "Request an Appointment"
  mobileRequestHref: ""
  mobileCallBackgroundColor: ""
  mobileCallBackgroundColorHex: ""
  mobileRequestBackgroundColor: ""
  mobileRequestBackgroundColorHex: ""
  mobileCallTextColor: ""
  mobileCallSmallTextColor: ""
  mobileRequestTextColor: ""
  mobileRequestSmallTextColor: ""
  addressLinkColor: ""
  addressLinkHoverColor: ""
  phoneLinkColor: ""
  phoneLinkHoverColor: ""
  pageButtons:
    - _component: building-blocks/core-elements/button
      text: Request an Appointment
      hideText: false
      link: /request-an-appointment/
      iconName: ""
      iconPosition: before
      variant: primary
      size: md
      width: md
  offices: []
preview:
  text:
    - Landing Header — Two Locations, Logo Centered
  icon: location_on
picker_preview:
  text: Landing Header — Two Locations, Logo Centered
  subtext: "Left office | centered logo | right office, with mobile call + CTA buttons."
  icon: location_on
_inputs:
  logoSource:
    type: image
    comment: "Logo image source URL or path."
  logoAlt:
    type: text
    comment: "Alt text for the logo image."
  mobileCallSmallText:
    type: text
    comment: "Small label above the phone number in the mobile call button."
  mobileRequestLabel:
    type: text
    comment: "Label for the request button in the mobile bar."
  mobileRequestHref:
    type: text
    comment: "Link for the mobile request button."
  mobileCallLabel:
    type: text
    comment: "Label shown above the phone number in the mobile call button (e.g. 'Call Now')."
  mobileCallBackgroundColor:
    type: select
    comment: "Background color of the mobile call button."
    options:
      values:
        - id: ""
          name: Default (Brand Secondary)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileCallBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for the mobile call button. Overrides the dropdown above."
  mobileRequestBackgroundColor:
    type: select
    comment: "Background color of the mobile request button."
    options:
      values:
        - id: ""
          name: Default (Brand Primary)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileRequestBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for the mobile request button. Overrides the dropdown above."
  mobileCallTextColor:
    type: select
    comment: "Main text color of the mobile call button."
    options:
      values:
        - id: ""
          name: Default (On Brand)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileCallSmallTextColor:
    type: select
    comment: "Small text color of the mobile call button."
    options:
      values:
        - id: ""
          name: Default (Match Main Text)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileRequestTextColor:
    type: select
    comment: "Main text color of the mobile request button."
    options:
      values:
        - id: ""
          name: Default (On Brand)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileRequestSmallTextColor:
    type: select
    comment: "Small text color of the mobile request button."
    options:
      values:
        - id: ""
          name: Default (Match Main Text)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  id:
    type: text
    comment: "Developer use only. Optional HTML id attribute for this header section."
  pageButtons:
    type: array
    comment: "CTA buttons. The first button is also used as the mobile request CTA."
    options:
      structures: _structures.buttonSections
  offices:
    type: array
    comment: "Office locations. The first office appears on the left, the second on the right. Leave empty to use siteInfo offices."
    options:
      structures: _structures.officeSections
  "$.offices[*].name":
    type: text
    comment: "Optional office label."
  "$.offices[*].phones[*].display":
    type: text
    comment: "Phone number as displayed (e.g. (123) 456-7890)."
  "$.offices[*].phones[*].href":
    type: text
    comment: "Phone href value (e.g. tel:+11234567890)."
  "$.offices[*].addresses[*].lines":
    type: array
    comment: "Street address lines."
  "$.offices[*].addresses[*].city":
    type: text
  "$.offices[*].addresses[*].state":
    type: text
  "$.offices[*].addresses[*].postalCode":
    type: text
  "$.offices[*].addresses[*].mapUrl":
    type: url
    comment: "Google Maps link for the address."
