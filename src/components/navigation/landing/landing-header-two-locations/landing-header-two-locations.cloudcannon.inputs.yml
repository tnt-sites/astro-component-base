id:
  type: text
  comment: "Developer use only. Optional HTML id attribute for this header section."
logoSource:
  type: image
  comment: Logo image source URL or path.
logoAlt:
  type: text
  comment: Alt text for the logo image.
pageButtons:
  type: array
  comment: Header CTA buttons.
  options:
    structures: _structures.buttonSections
offices:
  type: array
  comment: Two offices used in the left and right columns.
  options:
    structures: _structures.officeSections
mobileCallSmallText:
  type: text
  comment: Small label above the phone number in the mobile call button.
mobileRequestLabel:
  type: text
  comment: Label for the request button in the mobile bar.
mobileRequestHref:
  type: text
  comment: Link for the mobile request button.
mobileCallBackgroundColor:
  type: select
  comment: Background color of the mobile call button.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
mobileRequestBackgroundColor:
  type: select
  comment: Background color of the mobile request button.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.background == true)]"
    value_key: id
    preview:
      text:
        - key: name
mobileCallTextColor:
  type: select
  comment: Main text color of the mobile call button.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
mobileCallSmallTextColor:
  type: select
  comment: Small text color of the mobile call button.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
mobileRequestTextColor:
  type: select
  comment: Main text color of the mobile request button.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
mobileRequestSmallTextColor:
  type: select
  comment: Small text color of the mobile request button.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
addressLinkColor:
  type: select
  comment: Color of address links.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
addressLinkHoverColor:
  type: select
  comment: Hover color of address links.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
phoneLinkColor:
  type: select
  comment: Color of phone links.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
phoneLinkHoverColor:
  type: select
  comment: Hover color of phone links.
  options:
    allow_empty: true
    values: "data.colors.all[?(@.text == true)]"
    value_key: id
    preview:
      text:
        - key: name
"$.offices[*].name":
  type: text
"$.offices[*].phones[*].display":
  type: text
"$.offices[*].phones[*].href":
  type: text
"$.offices[*].addresses[*].lines":
  type: array
"$.offices[*].addresses[*].city":
  type: text
"$.offices[*].addresses[*].state":
  type: text
"$.offices[*].addresses[*].postalCode":
  type: text
"$.offices[*].addresses[*].mapUrl":
  type: url
