label: Landing Header - Circle Icons
icon: view_column
description: "Landing header with circular icon badges on address and phone links, logo, and CTA button."
value:
  _component: navigation/landing/landing-header-circle-icons
  logoSource: /images/logo.svg
  logoAlt: Logo
  pageButtons:
    - _component: building-blocks/core-elements/button
      text: Request an Appointment
      hideText: false
      link: ""
      iconName: icon-calendar-1
      iconPosition: before
      variant: primary
      size: md
      width: md
  offices: []
  backgroundColor: ""
  backgroundColorHex: ""
  iconBackgroundColor: ""
  iconBackgroundColorHex: ""
  linkColor: ""
  linkColorHex: ""
  addressLinkColor: ""
  addressLinkHoverColor: ""
  phoneLinkColor: ""
  phoneLinkHoverColor: ""
  mobileCallBackgroundColor: ""
  mobileCallBackgroundColorHex: ""
  mobileRequestBackgroundColor: ""
  mobileRequestBackgroundColorHex: ""
  mobileCallSmallText: "Call Now"
  mobileRequestLabel: "Request an Appointment"
  mobileRequestHref: ""
preview:
  text:
    - Landing Header - Circle Icons
  icon: view_column
picker_preview:
  text: Landing Header - Circle Icons
  subtext: "Logo, circular icon badges on contact links, CTA button."
  icon: view_column
_inputs:
  logoSource:
    type: image
    comment: "Logo image source URL or path."
  logoAlt:
    type: text
    comment: "Alt text for the logo image."
  pageButtons:
    type: array
    comment: "Header CTA buttons displayed on the right."
    options:
      structures: _structures.buttonSections
  offices:
    type: array
    comment: "Optional office contact override. Leave empty to use siteInfo offices."
    options:
      structures: _structures.officeSections
  "$.offices[*].name":
    type: text
    comment: "Optional office label."
  "$.offices[*].phones[*].display":
    type: text
    comment: "Phone number as displayed (e.g. (123) 456-7890)."
  "$.offices[*].phones[*].href":
    type: text
    comment: "Phone href value (e.g. tel:+11234567890)."
  "$.offices[*].addresses[*].lines":
    type: array
    comment: "Street address lines."
  "$.offices[*].addresses[*].city":
    type: text
  "$.offices[*].addresses[*].state":
    type: text
  "$.offices[*].addresses[*].postalCode":
    type: text
  "$.offices[*].addresses[*].mapUrl":
    type: url
    comment: "Google Maps link for the address."
  "$.offices[*].officeHours":
    type: array
    hidden: true
  "$.offices[*].officeHours[*].day":
    type: text
    hidden: true
  "$.offices[*].officeHours[*].hours":
    type: text
    hidden: true
  "$.offices[*].officeHoursNote":
    type: text
    hidden: true
  backgroundColor:
    type: select
    comment: "Header background color."
    options:
      values:
        - id: ""
          name: Default (White)
        - id: none
          name: None
        - id: base
          name: Base
        - id: surface
          name: Surface
        - id: accent
          name: Accent
        - id: highlight
          name: Highlight
        - id: dark
          name: Dark
        - id: black
          name: Black
  backgroundColorHex:
    type: color
    comment: "Optional custom hex color for the header background. Overrides the dropdown above."
  iconBackgroundColor:
    type: select
    comment: "Background color of the circular icon badges."
    options:
      values:
        - id: ""
          name: Default (Brand)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  iconBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for icon badges. Overrides the dropdown above."
  linkColor:
    type: select
    comment: "Color of the address and phone link text."
    options:
      values:
        - id: ""
          name: Default
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  linkColorHex:
    type: color
    comment: "Optional custom hex color for link text. Overrides the dropdown above."
  mobileCallBackgroundColor:
    type: select
    comment: "Background color of the mobile call button."
    options:
      values:
        - id: ""
          name: Default (Match Icon Background)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileCallBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for the mobile call button. Overrides the dropdown above."
  mobileRequestBackgroundColor:
    type: select
    comment: "Background color of the mobile request button."
    options:
      values:
        - id: ""
          name: Default (Match Icon Background)
        - id: brand
          name: Brand Primary
        - id: brand-secondary
          name: Brand Secondary
        - id: brand-tertiary
          name: Brand Tertiary
        - id: dark
          name: Dark
        - id: white
          name: White
  mobileRequestBackgroundColorHex:
    type: color
    comment: "Optional custom hex color for the mobile request button. Overrides the dropdown above."
  mobileCallSmallText:
    type: text
    comment: "Small label above the phone number in the mobile call button."
  mobileRequestLabel:
    type: text
    comment: "Label for the appointment button in the mobile bar."
  mobileRequestHref:
    type: text
    comment: "Link for the mobile appointment button."
  id:
    type: text
    comment: "Developer use only. Optional HTML id attribute for this header."
