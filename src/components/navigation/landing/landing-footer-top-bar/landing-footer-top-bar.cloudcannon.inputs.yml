logoSource:
  type: image
  comment: Footer logo image source.

logoAlt:
  type: text
  comment: Alt text for the footer logo.

siteName:
  type: text
  comment: Site name shown in the copyright line.

contactTitle:
  type: text
  comment: Contact column title.

offices:
  type: array
  comment: Office details used for address, phone, and office hours.
  options:
    structures: _structures.officeSections

mapEmbedUrl:
  type: text
  comment: Embedded Google Map URL for the right map panel.

legalLinks:
  type: array
  comment: Footer legal links.
  options:
    structures:
      values:
        - label: Legal Link
          icon: link
          value:
            name: ""
            path: ""
          _inputs:
            name:
              type: text
            path:
              type: text

legalBlurb:
  type: textarea
  comment: Optional legal copy shown below copyright links.

linkColor:
  type: select
  comment: Color of copyright row links.
  options:
    allow_empty: true
    values: _select_data.brandColors

linkHoverColor:
  type: select
  comment: Color of copyright row links on hover.
  options:
    allow_empty: true
    values: _select_data.brandColors

backgroundImage:
  type: object
  comment: Optional background image behind the footer.
  options:
    structures:
      values:
        - label: Background Image
          icon: image
          value:
            source: ""
            alt: ""
          _inputs:
            source:
              type: image
              options:
                paths:
                  uploads: src/assets/images
                  static: ""
            alt:
              type: text

backgroundColor:
  type: select
  comment: Footer background color fallback when no image is provided.
  options:
    allow_empty: true
    values: _select_data.backgroundColors
textColor:
  type: select
  comment: Color of the body text in this section. Leave empty for the default.
  options:
    allow_empty: true
    values: _select_data.brandColors
officeHoursAlignment:
  type: select
  comment: Align hours text within each office-hours row while keeping the day and time columns aligned.
  options:
    values:
      - id: right
        name: Right aligned hours
      - id: left
        name: Left aligned hours

accentColor:
  label: Accent Color
  type: select
  options:
    allow_empty: true
    values: _select_data.brandColors
addressLinkColor:
  type: select
  comment: Color of address links.
  options:
    allow_empty: true
    values: _select_data.brandColors
addressLinkHoverColor:
  type: select
  comment: Color of address links on hover.
  options:
    allow_empty: true
    values: _select_data.brandColors
phoneLinkColor:
  type: select
  comment: Color of phone links.
  options:
    allow_empty: true
    values: _select_data.brandColors
phoneLinkHoverColor:
  type: select
  comment: Color of phone links on hover.
  options:
    allow_empty: true
    values: _select_data.brandColors
